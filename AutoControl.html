<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutoControl</title>
<meta name="theme-color" content="#4A3AA7">
<link rel="stylesheet" href="lib/leaflet.css" onerror="this.onerror=null;this.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css'">
<script src="lib/leaflet.js"></script>
<script>window.L || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"><\/script>')</script>
<script src="lib/leaflet-rotate.js"></script>
<script>window.L && !L.Map.prototype.setBearing && document.write('<script src="https://cdn.jsdelivr.net/npm/leaflet-rotate@0.2.8/dist/leaflet-rotate.js"><\/script>')</script>
<style>
/* Misma filosofia que Kakeibo: fondo calido, un color de identidad por seccion,
   verde/rojo semanticos siempre con icono + texto, esquinas redondeadas. */
:root{
  --page:#FAF6EF;--surf:#FFFFFF;--surf2:#F3EEE3;--border:#E7E0D2;
  --tx:#2B2620;--tx2:#6F6656;--tx3:#9C927E;
  --ok:#1E9E5A;--ok-bg:#E4F7EC;--bad:#E4483F;--bad-bg:#FCEAE8;--warn:#B87A00;--warn-bg:#FBF0DC;
  --dash:#4A3AA7;--dash-bg:#EFEAFB;--mov:#EB6834;--mov-bg:#FDEEE5;--tar:#D6467E;--tar-bg:#FBE7EF;
  --pre:#1BAF7A;--pre-bg:#E3F6EE;--his:#C98500;--his-bg:#FBF0DC;--cal:#2A78D6;--cal-bg:#E8F1FC;
  --cam:#0E7C86;--cam-bg:#E3F5F6;--cfg:#546E7A;--cfg-bg:#ECEFF1;--inv:#3F51B5;--inv-bg:#E8EAF6;
  --com:#00897B;--com-bg:#E0F2F1;--red:#E4483F;--red-bg:#FCEAE8;--gps:#0F8A50;--gps-bg:#E3F4EA;
  --shadow:0 4px 14px rgba(0,0,0,.06);--r:16px;--rs:10px;--rl:24px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#1C1A17;--surf:#26231F;--surf2:#312D27;--border:#3D382F;
  --tx:#F2EDE4;--tx2:#C2B8A6;--tx3:#8F8574;
  --ok:#34B870;--ok-bg:#1B3326;--bad:#EF5F56;--bad-bg:#3A1F1D;--warn:#D99A1E;--warn-bg:#3A2F18;
  --dash:#7B6BE0;--dash-bg:#2C2744;--mov:#EB6834;--mov-bg:#3A2A20;--tar:#E0588E;--tar-bg:#3A2230;
  --pre:#1BAF7A;--pre-bg:#1D3329;--his:#D99A1E;--his-bg:#3A2F18;--cal:#4A90E2;--cal-bg:#1E2C3F;
  --cam:#1A9AA5;--cam-bg:#193234;--cfg:#90A4AE;--cfg-bg:#2A3236;--inv:#7986CB;--inv-bg:#252A45;
  --com:#26A69A;--com-bg:#1B3330;--red:#EF5F56;--red-bg:#3A1F1D;--gps:#34B870;--gps-bg:#1B3326;--shadow:0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --page:#1C1A17;--surf:#26231F;--surf2:#312D27;--border:#3D382F;
  --tx:#F2EDE4;--tx2:#C2B8A6;--tx3:#8F8574;
  --ok:#34B870;--ok-bg:#1B3326;--bad:#EF5F56;--bad-bg:#3A1F1D;--warn:#D99A1E;--warn-bg:#3A2F18;
  --dash:#7B6BE0;--dash-bg:#2C2744;--mov:#EB6834;--mov-bg:#3A2A20;--tar:#E0588E;--tar-bg:#3A2230;
  --pre:#1BAF7A;--pre-bg:#1D3329;--his:#D99A1E;--his-bg:#3A2F18;--cal:#4A90E2;--cal-bg:#1E2C3F;
  --cam:#1A9AA5;--cam-bg:#193234;--cfg:#90A4AE;--cfg-bg:#2A3236;--inv:#7986CB;--inv-bg:#252A45;
  --com:#26A69A;--com-bg:#1B3330;--red:#EF5F56;--red-bg:#3A1F1D;--gps:#34B870;--gps-bg:#1B3326;--shadow:0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--tx);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.ic{flex:none;display:block}
.app{display:flex;min-height:100vh}

/* ---------- Barra lateral ---------- */
.side{width:250px;flex:none;background:var(--surf);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px 12px}
.brand-logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--dash),color-mix(in srgb,var(--dash) 55%,#000))}
.brand b{font-size:17px;display:block;line-height:1.1}
.brand small{color:var(--tx3);font-size:12px}
.side-veh{margin:6px 14px 10px;padding:12px;border-radius:var(--r);background:var(--surf2);display:flex;flex-direction:column;gap:8px}
.side-veh .name{font-weight:600;font-size:13px}
.side-veh .km{color:var(--tx2);font-size:12px}
.side-veh select{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:var(--rs);background:var(--surf)}
nav{padding:4px 10px 14px;display:flex;flex-direction:column;gap:2px}
.nav-sep{height:1px;background:var(--border);margin:8px 8px}
.nav-i{display:flex;align-items:center;gap:10px;padding:7px 10px;border:0;background:none;border-radius:12px;cursor:pointer;text-align:left;color:var(--tx2);font-weight:500;width:100%}
.nav-i .chip{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--c);background:transparent;transition:background .15s}
.nav-i:hover{background:var(--surf2)}
.nav-i.on{background:var(--cb);color:var(--tx);font-weight:600}
.nav-i.on .chip{background:var(--c);color:#fff}
.nav-i .badge{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;font-weight:700;border-radius:20px;padding:1px 7px}
.side-foot{margin-top:auto;padding:12px 18px 18px;color:var(--tx3);font-size:12px}
.topbar{display:none}

/* ---------- Contenido ---------- */
main{flex:1;min-width:0;padding:28px 34px 60px}
.sec{max-width:1180px;margin:0 auto}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:var(--rl);background:var(--cb);color:var(--c);font-weight:600;font-size:12px}
h1{margin:8px 0 2px;font-size:26px;letter-spacing:-.01em}
h2{font-size:16px;margin:0 0 12px}
h3{font-size:15px;margin:0}
.sub{color:var(--tx2);margin:0}
.muted{color:var(--tx3)}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.cards{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.tiles{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:16px}
.two{grid-template-columns:1fr 1fr}
.stack>*+*{margin-top:16px}
.tile{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.tile-l{display:flex;align-items:center;gap:8px;color:var(--tx2);font-size:12.5px;font-weight:600}
.tile-l .chip{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--tc-bg,var(--cb));color:var(--tc,var(--c))}
.tile-v{font-size:23px;font-weight:700;margin-top:8px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.tile-s{color:var(--tx3);font-size:12.5px;margin-top:2px}

/* Hero del auto */
.hero{border-radius:var(--rl);padding:24px 26px;color:#fff;background:linear-gradient(135deg,var(--dash),color-mix(in srgb,var(--dash) 55%,#000));display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:16px;box-shadow:var(--shadow)}
.hero h2{font-size:22px;margin:10px 0 2px}
.hero .meta{color:#fff;opacity:.85}
.hero .big{font-size:34px;font-weight:700;letter-spacing:-.02em;text-align:right;font-variant-numeric:tabular-nums}
.hero .big small{display:block;font-size:13px;font-weight:500;opacity:.8;letter-spacing:0}

/* Patente estilo Mercosur */
.plate{display:inline-flex;flex-direction:column;align-items:stretch;background:#fff;border:2px solid #1b1b1b;border-radius:6px;overflow:hidden;min-width:112px;vertical-align:middle}
.plate .band{background:#1D4FA3;color:#fff;font-size:7px;font-weight:700;text-align:center;letter-spacing:.1em;padding:2px 6px}
.plate .num{font:700 18px/1.15 Consolas,"Courier New",monospace;letter-spacing:.1em;color:#111;padding:2px 10px 3px;text-align:center;white-space:nowrap}
.plate.sm{min-width:84px}.plate.sm .num{font-size:13px;padding:1px 6px 2px}.plate.sm .band{font-size:5.5px;padding:1px 4px}

/* Botones */
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:var(--rs);padding:10px 16px;border:1px solid transparent;cursor:pointer;font-weight:600;white-space:nowrap}
.btn.primary{background:var(--c,var(--dash));color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sec{background:var(--surf);border-color:var(--border);color:var(--tx2)}
.btn.sec:hover{background:var(--surf2)}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{padding:6px 11px;font-size:13px}
.ibtn{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:9px;border:1px solid var(--border);background:var(--surf);color:var(--tx2);cursor:pointer}
.ibtn:hover{background:var(--surf2);color:var(--tx)}
.ibtn.del:hover{color:var(--bad);background:var(--bad-bg)}
.row-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:14px}
.row-actions.right{justify-content:flex-end;margin-top:0}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--c,var(--dash));outline-offset:2px}

/* Estados */
.st{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.st.ok{background:var(--ok-bg);color:var(--ok)}
.st.bad{background:var(--bad-bg);color:var(--bad)}
.st.warn{background:var(--warn-bg);color:var(--warn)}
.st.mute{background:var(--surf2);color:var(--tx3)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--surf2);color:var(--tx2)}
.tag.c{background:var(--cb);color:var(--c)}

/* Listas */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:14px;align-items:center;padding:12px 4px;border-top:1px solid var(--border)}
.li:first-child{border-top:0}
.li.click{cursor:pointer;border-radius:10px;padding-left:8px;padding-right:8px}
.li.click:hover{background:var(--surf2)}
.li .chip{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--cb);color:var(--c)}
.li .chip.ok{background:var(--ok-bg);color:var(--ok)}.li .chip.bad{background:var(--bad-bg);color:var(--bad)}.li .chip.warn{background:var(--warn-bg);color:var(--warn)}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600}
.li .d{color:var(--tx2);font-size:13px;overflow-wrap:anywhere}
.li .r{text-align:right;flex:none;font-variant-numeric:tabular-nums}
.li .r .d{font-size:12px}
.amt{font-weight:700;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:12px 0 0;font-size:13px}
.kv dt{color:var(--tx3)}.kv dd{margin:0;text-align:right;font-weight:600;overflow-wrap:anywhere}
.meta{color:var(--tx2);font-size:13px}
.veh.active{border-color:var(--c);box-shadow:0 0 0 1px var(--c),var(--shadow)}
.veh-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.card h3{margin-bottom:2px}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.prog{height:8px;border-radius:8px;background:var(--surf2);overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;border-radius:8px;background:var(--ok)}
.prog.warn i{background:var(--warn)}.prog.bad i{background:var(--bad)}.prog.mute i{background:var(--tx3)}
.notes{margin-top:10px;font-size:13px;color:var(--tx2);background:var(--surf2);border-radius:var(--rs);padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filters input,.filters select{padding:9px 12px;border:1px solid var(--border);border-radius:var(--rs);background:var(--surf);min-width:0}
.search{position:relative;flex:1;min-width:200px;max-width:360px}
.search input{width:100%;padding-left:36px}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--tx3)}
.summary{margin-left:auto;color:var(--tx2);font-size:13px}
table.tb{width:100%;border-collapse:collapse;font-size:13.5px}
.tb th{text-align:left;color:var(--tx3);font-weight:600;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--border)}
.tb td{padding:9px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
.tb tr:last-child td{border-bottom:0}
.tb .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tb-wrap{overflow-x:auto}
.empty{text-align:center;padding:42px 20px}
.empty .chip{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;margin:0 auto 12px;background:var(--cb);color:var(--c)}
.empty p{color:var(--tx2);margin:0 0 16px}
.welcome h2{font-size:22px}
.welcome ol{color:var(--tx2);padding-left:20px;margin:6px 0 18px}
.year-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}

/* Graficos */
.chart{width:100%;min-height:230px;position:relative}
.chart svg{display:block;overflow:visible}
.chart .grid{stroke:var(--border);stroke-width:1}
.chart .axl{fill:var(--tx3);font-size:11px}
.chart .ln{fill:none;stroke:var(--c);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--c);opacity:.08}
.chart .dot{fill:var(--c);stroke:var(--surf);stroke-width:2}
.chart .xh{stroke:var(--tx3);stroke-width:1;stroke-dasharray:3 3}
.chart .bar{fill:var(--c);transition:opacity .12s}
.chart .bars.hov .bar{opacity:.35}.chart .bars.hov .bar.on{opacity:1}
.chart .hit{fill:transparent;cursor:crosshair}
.chart-empty{display:grid;place-items:center;height:200px;color:var(--tx3);text-align:center;padding:0 20px}
.tt{position:fixed;z-index:60;pointer-events:none;background:var(--tx);color:var(--page);padding:7px 10px;border-radius:8px;font-size:12.5px;box-shadow:0 6px 18px rgba(0,0,0,.2);display:none;max-width:240px}
.tt b{display:block}

/* Dialogos */
.modal{position:fixed;inset:0;background:rgba(20,16,10,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:5vh 16px;overflow-y:auto}
.modal.open{display:flex}
.dlg{background:var(--surf);border-radius:var(--r);width:100%;max-width:560px;box-shadow:0 20px 50px rgba(0,0,0,.25);padding:22px 24px 20px}
.dlg-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.dlg-h .chip{width:34px;height:34px;border-radius:var(--rs);display:grid;place-items:center;background:var(--cb);color:var(--c)}
.dlg-h h3{font-size:17px;flex:1}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.field{grid-column:span 2;display:flex;flex-direction:column;gap:4px;min-width:0}
.field.half{grid-column:span 1}
.field label{font-size:12.5px;font-weight:600;color:var(--tx2)}
.field input,.field select,.field textarea{padding:9px 11px;border:1px solid var(--border);border-radius:var(--rs);background:var(--surf);width:100%;min-width:0}
.field textarea{resize:vertical}
.field .hint{font-size:12px;color:var(--tx3)}
.ferr{font-size:12px;color:var(--bad);min-height:0}
.req{color:var(--bad)}
.chk{grid-column:span 2;display:flex;align-items:center;gap:8px;font-weight:600;color:var(--tx2);cursor:pointer}
.chk.half{grid-column:span 1;align-self:end;padding-bottom:9px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.chip-chk{cursor:pointer}
.chip-chk input{position:absolute;opacity:0;pointer-events:none}
.chip-chk span{display:inline-block;padding:5px 11px;border-radius:20px;border:1px solid var(--border);font-size:12.5px;color:var(--tx2)}
.chip-chk input:checked+span{background:var(--cb);border-color:var(--c);color:var(--c);font-weight:600}
.chip-chk input:focus-visible+span{outline:2px solid var(--c);outline-offset:2px}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--tx);color:var(--page);padding:10px 16px;border-radius:12px;opacity:0;transition:.2s;z-index:70;pointer-events:none;font-weight:500;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.err{background:var(--bad);color:#fff}
.opt-row{display:flex;gap:8px;flex-wrap:wrap}
.opt-row .btn.on{background:var(--cb);border-color:var(--c);color:var(--c)}
a.btn{text-decoration:none}

/* GPS y mapas */
.gps-side{margin:0 14px 10px;width:calc(100% - 28px);display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 12px;border-radius:12px;border:1px dashed var(--gps);background:transparent;color:var(--gps);font-weight:600;cursor:pointer}
.gps-side:hover{background:var(--gps-bg)}
.gps-side.on{background:var(--gps);border-style:solid;color:#fff}
.gps-side.pend{border-color:var(--warn);color:var(--warn)}
.gps-side.pend:hover{background:var(--warn-bg)}
.pulse{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none;animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 55%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.gps-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.gps-big{display:flex;gap:32px;flex-wrap:wrap;align-items:flex-end;margin:16px 0}
.gps-num{font-size:48px;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.gps-num.sm{font-size:26px}
.gps-stats{grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:14px}
.gps-stats>div{background:var(--surf2);border-radius:var(--rs);padding:10px 12px;color:var(--tx2);font-size:12.5px}
.gps-stats b{display:block;color:var(--tx);font-size:17px;font-variant-numeric:tabular-nums}
.gps-start{text-align:center;padding:34px 20px}
.gps-start .chip{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;margin:0 auto 14px;background:var(--cb);color:var(--c)}
.gps-start p{color:var(--tx2);max-width:520px;margin:0 auto 18px}
.gps-start .opt-row{justify-content:center}
.map{width:100%;height:280px;border:0;border-radius:var(--rs);background:var(--surf2);display:block}
.near{display:flex;flex-wrap:wrap;gap:8px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px;border-color:var(--warn);background:var(--warn-bg)}
.banner>.ic{color:var(--warn)}
.ruta{flex:none;background:var(--cb);border-radius:11px}
.ruta polyline{fill:none;stroke:var(--c);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ruta circle{fill:var(--c)}
.topbar .ibtn.on{background:var(--gps);border-color:var(--gps);color:#fff}

/* ---------- Mapa integrado ---------- */
.mini-wrap{position:relative;border-radius:var(--rs);overflow:hidden;isolation:isolate}
.mini-wrap .map{height:220px}
.mini-go{position:absolute;inset:0;z-index:500;border:0;background:transparent;cursor:pointer}
.mini-go span{position:absolute;right:10px;bottom:10px;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;background:var(--surf);color:var(--tx);font-weight:600;font-size:12.5px;box-shadow:var(--shadow)}
.mapa{--c:#2A78D6;position:fixed;inset:0;z-index:45;background:var(--surf2);display:flex;flex-direction:column}
.mapa[hidden]{display:none}
.mapa-map{flex:1;min-height:0;background:var(--surf2)}
.mapa-top{position:absolute;top:0;left:0;right:0;z-index:1000;display:flex;gap:8px;align-items:center;padding:12px 12px 0;pointer-events:none}
.mapa-top>*{pointer-events:auto}
.mapa-top .ibtn,.mapa-fab{width:44px;height:44px;border-radius:14px;border:0;background:var(--surf);color:var(--tx);box-shadow:0 2px 10px rgba(0,0,0,.18);flex:none}
.mapa-busca{flex:1;display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:14px;background:var(--surf);box-shadow:0 2px 10px rgba(0,0,0,.18);color:var(--tx3)}
.mapa-busca input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:15px;color:var(--tx)}
.mapa-chips{position:absolute;top:64px;left:0;right:0;z-index:1000;display:flex;gap:8px;overflow-x:auto;padding:0 12px 6px;scrollbar-width:none}
.mapa-chips::-webkit-scrollbar{display:none}
.mchip{flex:none;display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;border:0;background:var(--surf);color:var(--tx);font-weight:500;box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:pointer;white-space:nowrap}
.mchip .ic{color:var(--gps)}
.mapa-fab{position:absolute;right:12px;bottom:calc(var(--sheet-h,0px) + 14px);z-index:1000;display:grid;place-items:center;cursor:pointer;transition:bottom .15s}
.mapa-fab.on{color:#2A78D6}
.mapa-sheet{position:absolute;left:0;right:0;bottom:0;z-index:1001;max-height:46%;overflow-y:auto;background:var(--surf);border-radius:20px 20px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.18);padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
.mapa-sheet:empty{display:none}
.ms-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ms-h b{flex:1;font-size:16px}
.ms-sub{color:var(--tx2);margin:0 0 12px}
.ms-list{display:flex;flex-direction:column;gap:2px}
.ms-li{display:flex;align-items:center;gap:10px;padding:9px 6px;border:0;background:none;border-radius:12px;text-align:left;cursor:pointer;width:100%}
.ms-li:hover{background:var(--surf2)}
.ms-li .chip{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--gps-bg);color:var(--gps);flex:none}
.ms-li b{display:block;font-weight:600}
.ms-li small{display:block;color:var(--tx2)}
.ms-acc{display:flex;gap:8px;flex-wrap:wrap}
.ms-acc .btn{flex:1;justify-content:center}
.ms-modo{display:flex;gap:6px;margin-bottom:12px}
.ms-modo button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border-radius:12px;border:1px solid var(--border);background:var(--surf);cursor:pointer;font-weight:500}
.ms-modo button.on{background:#2A78D6;border-color:#2A78D6;color:#fff}
.ms-pasos{margin-top:12px}
.ms-pasos summary{cursor:pointer;color:var(--tx2);font-weight:500}
.ms-pasos ol{margin:8px 0 0;padding-left:20px;color:var(--tx2)}
.ms-pasos li{margin:4px 0}
.ms-pasos li b{color:var(--tx);font-weight:500}
.mapa.navegando .mapa-chips,.mapa.navegando .mapa-busca{visibility:hidden}
.nav-ins{display:flex;align-items:center;gap:14px;padding:14px;margin:-14px -16px 12px;background:#1E6B45;color:#fff;border-radius:20px 20px 0 0}
.nav-fl{width:52px;height:52px;flex:none;display:grid;place-items:center;border-radius:14px;background:rgba(255,255,255,.15)}
.nav-fl .ic{transform:rotate(var(--rot,0deg))}
.nav-d{font-size:24px;font-weight:700;line-height:1.1}
.nav-t{font-size:15px;opacity:.95}
.nav-pie{display:flex;align-items:center;gap:10px}
.nav-pie .grow{flex:1}

.m-yo{width:22px;height:22px;border-radius:50%;background:#2A78D6;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.35)}

.mapa-brujula.on{color:#2A78D6}
.mapa-odo{position:absolute;left:12px;bottom:calc(var(--sheet-h,0px) + 14px);z-index:1000;display:flex;align-items:center;gap:10px;padding:6px 12px 6px 6px;border-radius:14px;background:var(--surf);color:var(--tx);box-shadow:0 2px 10px rgba(0,0,0,.18);transition:bottom .15s;pointer-events:none;line-height:1.15}

<script>
"use strict";
/* ================== Datos ================== */
// Versión de la app: única fuente; android/build.sh la usa como versionName del APK.
const APP_VERSION = '1.2';
const KEY = 'autocontrol.v1';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const COLS = ['vehiculos','km','plan','historial','combustible','patentes','papeles','mecanicos','gastos','viajes'];
// gpsActivo: recorrido en curso (se guarda para no perderlo si se cierra la pestaña).
function blank(){ const b = {version:1, tema:'sistema', vid:null, ultimoBackup:null, gpsActivo:null, estacionado:null}; COLS.forEach(c => b[c] = []); return b; }
function load(){
  try{ const r = localStorage.getItem(KEY); if(r){ const d = JSON.parse(r); const b = blank(); Object.assign(b, d); COLS.forEach(c => { if(!Array.isArray(b[c])) b[c] = []; }); b.papeles.forEach(p => { if(TIPO_VIEJO[p.tipo]) p.tipo = TIPO_VIEJO[p.tipo]; }); return b; } }catch(e){}
  return blank();
}
let S = load();
/* Preparado para sincronizar web ↔ APK más adelante: cada registro lleva `mod` (última modificación)
   y los borrados quedan en S.borrados {id: fecha}, así se pueden mezclar dos copias sin perder cambios.
   S.dispositivo identifica a esta copia (web o Android). */
const DISPOSITIVO = S.dispositivo || (window.Android ? 'android-' : 'web-') + uid();
let huellas = null;
function huellasDe(){ const m = new Map(); COLS.forEach(c => S[c].forEach(i => { if(i && i.id){ const {mod, ...resto} = i; m.set(i.id, JSON.stringify(resto)); } })); return m; }
function marcarCambios(){
  S.dispositivo = DISPOSITIVO;
  if(!S.borrados || typeof S.borrados !== 'object') S.borrados = {};
  const ahora = Date.now(), nuevas = huellasDe();
  COLS.forEach(c => S[c].forEach(i => { if(i && i.id && (!i.mod || (huellas && huellas.get(i.id) !== nuevas.get(i.id)))) i.mod = ahora; }));
  if(huellas) huellas.forEach((_, id) => { if(!nuevas.has(id)) S.borrados[id] = ahora; });
  nuevas.forEach((_, id) => { delete S.borrados[id]; });
  huellas = nuevas;
}
marcarCambios();
let avisoGuardado = false;
function save(){
  marcarCambios();
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ if(!avisoGuardado){ avisoGuardado = true; toast('Este navegador no deja guardar datos. Exportá un backup desde Configuración.', true); } }
}

const TIPOS_H = ['Service','Reparación','Neumáticos','Frenos','Suspensión','Electricidad','Chapa y pintura','Revisión / diagnóstico','Otro'];
const MONEDAS = [['ARS','Pesos (ARS)'],['USD','Dólares (USD)']];
const COMBUSTIBLES = ['Nafta','Diésel','GNC','Nafta + GNC','Híbrido','Eléctrico'];
const TIPOS_PAPEL = ['VTV / ITV','Póliza de seguro','Carnet de conducir','DNI','Cédula verde','Cédula azul (autorizado)','Título del automotor','Matafuegos','Oblea GNC','Otro'];
const TIPO_VIEJO = {'Seguro':'Póliza de seguro', 'Licencia de conducir':'Carnet de conducir', 'Cédula del vehículo':'Cédula verde'};
const CAT_GASTO = ['Seguro','Cochera / estacionamiento','Peajes','Lavado','Multas','Accesorios','Otro'];
// Intervalos orientativos: cada auto tiene los suyos en el manual.
const PLAN_SUGERIDO = [
  ['Aceite y filtro de aceite',10000,12],['Filtro de aire',20000,24],['Filtro de habitáculo',15000,12],
  ['Filtro de combustible',40000,36],['Bujías',40000,36],['Correa de distribución',60000,48],
  ['Líquido de frenos',null,24],['Pastillas de freno (revisión)',20000,12],['Alineación, balanceo y rotación',10000,12],
  ['Líquido refrigerante',40000,24],['Batería (revisión)',null,12],
];

/* ================== Utilidades ================== */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = new Intl.NumberFormat('es-AR');
const nf2 = new Intl.NumberFormat('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2});
const nf1 = new Intl.NumberFormat('es-AR', {maximumFractionDigits:1});
const nfc = new Intl.NumberFormat('es-AR', {notation:'compact', maximumFractionDigits:1});
const MESES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const MESES_L = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function iso(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
const hoy = () => iso(new Date());
function pd(s){ if(!s) return null; const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addMonths(s, n){ const d = pd(s), day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth()+1, 0).getDate())); return iso(d); }
const diasHasta = s => Math.round((pd(s) - pd(hoy())) / 864e5);
const fF = s => { if(!s) return '—'; const [y,m,d] = s.split('-'); return `${d}/${m}/${y}`; };
const fKm = n => n == null || isNaN(n) ? '—' : nf.format(Math.round(n)) + ' km';
const fMoney = (c, mon='ARS') => (mon === 'USD' ? 'US$ ' : '$ ') + nf2.format((c||0) / 100);
const centsToInput = c => nf2.format(c / 100);
function parseMonto(v){
  let s = String(v ?? '').trim().replace(/\s|\$|US/gi, ''); if(!s) return 0;
  if(s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = Number(s); return isFinite(n) && n >= 0 ? Math.round(n * 100) : NaN;
}
function parseKm(v){ const s = String(v ?? '').trim().replace(/[.\s]/g, '').replace(/km$/i, ''); if(!s) return null; const n = Number(s.replace(',', '.')); return isFinite(n) && n >= 0 ? Math.round(n) : NaN; }
function parseDec(v){ let s = String(v ?? '').trim(); if(!s) return null; if(s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); const n = Number(s); return isFinite(n) && n >= 0 ? n : NaN; }
const plural = (n, a, b) => n === 1 ? a : b;
function txtDias(d){
  if(d < 0) return `Venció hace ${-d} ${plural(-d,'día','días')}`;
  if(d === 0) return 'Vence hoy';
  if(d > 60) return `Faltan ${Math.round(d/30.44)} meses`;
  return `Faltan ${d} ${plural(d,'día','días')}`;
}
const estadoDias = d => d == null ? 'ok' : d < 0 ? 'vencido' : d <= 30 ? 'proximo' : 'ok';
function fmtPatente(p){
  const s = String(p || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if(/^[A-Z]{2}\d{3}[A-Z]{2}$/.test(s)) return s.slice(0,2) + ' ' + s.slice(2,5) + ' ' + s.slice(5);
  if(/^[A-Z]{3}\d{3}$/.test(s)) return s.slice(0,3) + ' ' + s.slice(3);
  return s || 'SIN PATENTE';
}

/* ================== Iconos ================== */
const P = {
  dash:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  car:'<path d="M3 13l2-5.5A2 2 0 0 1 6.9 6h10.2a2 2 0 0 1 1.9 1.5L21 13v4h-2.2M3 13v4h2.2M3 13h18M9.8 17h4.4"/><circle cx="7.5" cy="17" r="2"/><circle cx="16.5" cy="17" r="2"/>',

const V = () => S.vehiculos.find(v => v.id === S.vid) || S.vehiculos[0] || null;
const deV = arr => { const v = V(); return v ? arr.filter(x => x.vid === v.id) : []; };
const byFechaDesc = (a, b) => (b.fecha || '').localeCompare(a.fecha || '') || (b.km || 0) - (a.km || 0);
function vNombre(v){ return v ? [v.marca, v.modelo].filter(Boolean).join(' ') || 'Mi auto' : ''; }

function puntosKm(v){
  const p = [];
  if(v.kmInicial != null && v.fechaAlta) p.push({fecha:v.fechaAlta, km:v.kmInicial, ts:-1, src:'Alta del vehículo', col:'vehiculos', id:v.id});
  for(const x of S.km) if(x.vid === v.id) p.push({fecha:x.fecha, km:x.km, ts:x.ts || 0, src:x.origen === 'gps' ? 'GPS' : 'Lectura', col:'km', id:x.id, nota:x.nota});
  for(const x of S.historial) if(x.vid === v.id && x.km) p.push({fecha:x.fecha, km:x.km, ts:x.ts || 0, src:'Taller', col:'historial', id:x.id, nota:x.descripcion});
  for(const x of S.combustible) if(x.vid === v.id && x.km) p.push({fecha:x.fecha, km:x.km, ts:x.ts || 0, src:'Carga de combustible', col:'combustible', id:x.id});
  return p.filter(x => x.fecha && x.km != null).sort((a, b) => a.fecha.localeCompare(b.fecha) || a.ts - b.ts || a.km - b.km);
}
// Vale el ultimo dato cargado (no el mas alto): asi una correccion manual
// pisa lo que haya calculado el GPS.
function kmActual(v){
  if(!v) return 0; const p = puntosKm(v);
  return p.length ? p[p.length-1].km : (v.kmInicial || 0);
}
function kmPorMes(v){
  const p = puntosKm(v); if(p.length < 2) return null;
  const a = p[0], b = p[p.length-1]; const dias = (pd(b.fecha) - pd(a.fecha)) / 864e5;
  if(dias < 20 || b.km <= a.km) return null;
  return (b.km - a.km) / dias * 30.44;
}
function estadoPlan(it, v){
  // Ultima vez: lo cargado a mano o el trabajo del historial mas reciente que lo incluya.
  const cands = [];
  if(it.ultimoKm != null || it.ultimaFecha) cands.push({fecha:it.ultimaFecha || '', km:it.ultimoKm});
  for(const h of S.historial) if(h.vid === v.id && (h.items || []).includes(it.id)) cands.push({fecha:h.fecha, km:h.km});
  cands.sort((a, b) => (b.fecha || '').localeCompare(a.fecha || '') || (b.km || 0) - (a.km || 0));
  const u = cands[0] || {};
  const uKm = u.km ?? null, uF = u.fecha || null;
  const kmA = kmActual(v), ritmo = kmPorMes(v);
  const proxKm = it.cadaKm && uKm != null ? uKm + it.cadaKm : null;
  const proxFecha = it.cadaMeses && uF ? addMonths(uF, it.cadaMeses) : null;
  const faltaKm = proxKm != null ? proxKm - kmA : null;
  const faltaDias = proxFecha ? diasHasta(proxFecha) : null;
  let estado = 'ok';
  if(uKm == null && !uF) estado = 'sin';
  else if((faltaKm != null && faltaKm <= 0) || (faltaDias != null && faltaDias <= 0)) estado = 'vencido';
  else if((faltaKm != null && faltaKm <= Math.max(1000, it.cadaKm * .1)) || (faltaDias != null && faltaDias <= 30)) estado = 'proximo';
  let estFecha = null;
  if(faltaKm != null && faltaKm > 0 && ritmo) estFecha = iso(new Date(pd(hoy()).getTime() + faltaKm / ritmo * 30.44 * 864e5));
  let pct = 0;
  if(faltaKm != null && it.cadaKm) pct = Math.max(pct, 1 - faltaKm / it.cadaKm);
  if(faltaDias != null && uF) { const tot = (pd(proxFecha) - pd(uF)) / 864e5; if(tot > 0) pct = Math.max(pct, 1 - faltaDias / tot); }
  // Dias "equivalentes" para ordenar por urgencia mezclando km y fecha.
  const eq = [];
  if(faltaDias != null) eq.push(faltaDias);
  if(faltaKm != null) eq.push(faltaKm / (ritmo || 1200) * 30.44);
  return {uKm, uF, proxKm, proxFecha, faltaKm, faltaDias, estado, estFecha, pct:Math.min(1, Math.max(0, pct)), urg: eq.length ? Math.min(...eq) : 1e9};
}
function txtFalta(e){
  const parts = [];
  if(e.faltaKm != null) parts.push(e.faltaKm <= 0 ? `pasado por ${fKm(-e.faltaKm)}` : `faltan ${fKm(e.faltaKm)}`);
  if(e.faltaDias != null) parts.push(e.faltaDias < 0 ? `venció hace ${-e.faltaDias} ${plural(-e.faltaDias,'día','días')}` : e.faltaDias === 0 ? 'vence hoy' : e.faltaDias > 60 ? `en ${Math.round(e.faltaDias/30.44)} meses` : `en ${e.faltaDias} ${plural(e.faltaDias,'día','días')}`);
  return parts.join(' · ');
}
function vencimientos(){
  const v = V(), out = [];
  for(const p of S.papeles) if(p.vence && (!p.vid || (v && p.vid === v.id))){
    const d = diasHasta(p.vence);
    out.push({fecha:p.vence, titulo:p.tipo, det:[p.entidad, txtDias(d)].filter(Boolean).join(' · '), sec:'papeles', estado:estadoDias(d), icon:'file', urg:d});
  }
  if(v){
    for(const c of S.patentes) if(c.vid === v.id && !c.pagado && c.vence){
      const d = diasHasta(c.vence);
      out.push({fecha:c.vence, titulo:`Patente ${c.anio} · ${nCuota(c).toLowerCase()}`, det:[c.monto ? fMoney(c.monto) : '', txtDias(d)].filter(Boolean).join(' · '), sec:'patentes', estado:estadoDias(d), icon:'plate', urg:d});
    }
    for(const it of deV(S.plan)){
      const e = estadoPlan(it, v);
      if(e.estado === 'sin') continue;
      out.push({fecha:e.proxFecha || e.estFecha, titulo:'Service: ' + it.nombre, det:txtFalta(e), sec:'service', estado:e.estado, icon:'wrench', urg:e.urg});
    }
  }
  return out.sort((a, b) => a.urg - b.urg);
}
function consumos(v){
  const c = S.combustible.filter(x => x.vid === v.id && x.km != null && x.litros).sort((a, b) => a.km - b.km || a.fecha.localeCompare(b.fecha));
  const res = {}; let last = null, litros = 0, sumL = 0, sumKm = 0;
  for(const x of c){
    if(last){ litros += x.litros; if(x.lleno){ const d = x.km - last.km; if(d > 0){ res[x.id] = litros / d * 100; sumL += litros; sumKm += d; } last = x; litros = 0; } }
    else if(x.lleno){ last = x; litros = 0; }
  }
  return {porCarga:res, prom: sumKm ? sumL / sumKm * 100 : null};
}
function movGastos(v){
  const g = [], add = (fecha, cat, desc, monto, moneda, col, id) => { if(monto > 0 && fecha) g.push({fecha, cat, desc, monto, moneda: moneda || 'ARS', col, id}); };
  if(!v) return g;
  for(const h of S.historial) if(h.vid === v.id) add(h.fecha, 'Taller', `${h.tipo}${h.descripcion ? ': ' + h.descripcion : ''}`, h.costo, h.moneda, 'historial', h.id);
  for(const c of S.combustible) if(c.vid === v.id) add(c.fecha, 'Combustible', `${c.litros ? nf1.format(c.litros) + ' L' : 'Carga'}${c.estacion ? ' · ' + c.estacion : ''}`, c.monto, c.moneda, 'combustible', c.id);
  for(const c of S.patentes) if(c.vid === v.id && c.pagado) add(c.pagado, 'Patente', `Patente ${c.anio} · ${nCuota(c).toLowerCase()}`, c.monto, 'ARS', 'patentes', c.id);
  for(const p of S.papeles) if(p.vid === v.id) add(p.desde, 'Papeles', `${p.tipo}${p.entidad ? ' · ' + p.entidad : ''}`, p.monto, p.moneda, 'papeles', p.id);
  for(const x of S.gastos) if(x.vid === v.id) add(x.fecha, x.categoria, x.desc || x.categoria, x.monto, x.moneda, 'gastos', x.id);
  return g.sort(byFechaDesc);
}
function sumarMonedas(arr){ const t = {ARS:0, USD:0}; for(const x of arr) t[x.moneda] = (t[x.moneda] || 0) + x.monto; return t; }
function txtMonedas(t){ const p = []; if(t.ARS || !t.USD) p.push(fMoney(t.ARS, 'ARS')); if(t.USD) p.push(fMoney(t.USD, 'USD')); return p.join(' + '); }

/* ================== Graficos ================== */
let CH = [];
const chart = (t, d, o) => { CH.push({t, d, o}); return `<div class="chart" data-ch="${CH.length - 1}"></div>`; };
function niceTicks(a, b, n){
  if(a === b){ a = a - Math.max(1, Math.abs(a) * .1); b = b + Math.max(1, Math.abs(b) * .1); }
  const st0 = (b - a) / n, mag = 10 ** Math.floor(Math.log10(st0)), e = st0 / mag;
  const step = (e >= 7.5 ? 10 : e >= 3.5 ? 5 : e >= 1.5 ? 2 : 1) * mag;
  const t = []; for(let v = Math.floor(a / step) * step; v <= Math.ceil(b / step) * step + step / 2; v += step) t.push(Math.round(v * 1e6) / 1e6);
  return t;
}
const tt = document.getElementById('tt');
function tip(x, y, html){ tt.innerHTML = html; tt.style.display = 'block'; const r = tt.getBoundingClientRect(); let l = x + 14, t = y - r.height - 10; if(l + r.width > innerWidth - 8) l = x - r.width - 14; if(t < 8) t = y + 16; tt.style.left = l + 'px'; tt.style.top = t + 'px'; }
const untip = () => tt.style.display = 'none';
function drawLine(el, pts, o){
  const W = Math.max(260, el.clientWidth), H = 230, m = {l:62, r:16, t:12, b:28};
  if(pts.length < 2){ el.innerHTML = `<div class="chart-empty">${o.empty}</div>`; return; }
  const xs = pts.map(p => pd(p.fecha).getTime()); let x0 = xs[0], x1 = xs[xs.length-1]; if(x1 === x0){ x0 -= 864e5 * 15; x1 += 864e5 * 15; }
  const ys = pts.map(p => p.v), tk = niceTicks(Math.min(...ys), Math.max(...ys), 4), y0 = tk[0], y1 = tk[tk.length-1];
  const X = t => m.l + (t - x0) / (x1 - x0) * (W - m.l - m.r), Y = v => m.t + (1 - (v - y0) / ((y1 - y0) || 1)) * (H - m.t - m.b);
  let s = `<svg width="${W}" height="${H}" role="img" aria-label="${esc(o.label)}">`;
  for(const t of tk) s += `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}"/><text class="axl" x="${m.l - 8}" y="${Y(t) + 4}" text-anchor="end">${o.fy(t)}</text>`;
  const fx = t => { const d = new Date(t); return MESES[d.getMonth()] + ' ' + String(d.getFullYear()).slice(2); };
  [[x0,'start'],[(x0 + x1) / 2,'middle'],[x1,'end']].forEach(([t, a]) => s += `<text class="axl" x="${X(t)}" y="${H - 6}" text-anchor="${a}">${fx(t)}</text>`);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + X(xs[i]).toFixed(1) + ',' + Y(p.v).toFixed(1)).join('');
  s += `<path class="area" d="${d}L${X(xs[xs.length-1]).toFixed(1)},${H - m.b}L${X(xs[0]).toFixed(1)},${H - m.b}Z"/><path class="ln" d="${d}"/>`;
  s += `<circle class="dot" cx="${X(xs[xs.length-1])}" cy="${Y(ys[ys.length-1])}" r="4.5"/>`;
  s += `<line class="xh" y1="${m.t}" y2="${H - m.b}" style="display:none"/><circle class="dot hd" r="5" style="display:none"/>`;
  s += `<rect class="hit" x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H - m.b}"/></svg>`;
  el.innerHTML = s;
  const svg = el.querySelector('svg'), xh = svg.querySelector('.xh'), hd = svg.querySelector('.hd'), hit = svg.querySelector('.hit');
  hit.addEventListener('pointermove', e => {
    const mx = e.clientX - svg.getBoundingClientRect().left; let bi = 0, bd = 1e9;
    xs.forEach((t, i) => { const dd = Math.abs(X(t) - mx); if(dd <= bd){ bd = dd; bi = i; } });
    const px = X(xs[bi]), py = Y(ys[bi]);
    xh.setAttribute('x1', px); xh.setAttribute('x2', px); xh.style.display = '';
    hd.setAttribute('cx', px); hd.setAttribute('cy', py); hd.style.display = '';
    tip(e.clientX, e.clientY, o.tt(pts[bi]));
  });
  hit.addEventListener('pointerleave', () => { xh.style.display = hd.style.display = 'none'; untip(); });
}
function barPath(x, y, w, h, r){ r = Math.min(r, h, w / 2); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; }
function drawBars(el, data, o){
  const W = Math.max(260, el.clientWidth), H = 230, m = {l:62, r:8, t:12, b:28};
  if(!data.some(d => d.v > 0)){ el.innerHTML = `<div class="chart-empty">${o.empty}</div>`; return; }
  const tk = niceTicks(0, Math.max(...data.map(d => d.v)), 4), y1 = tk[tk.length-1];
  const Y = v => m.t + (1 - v / (y1 || 1)) * (H - m.t - m.b), cw = (W - m.l - m.r) / data.length, bw = Math.max(4, Math.min(42, cw - 6));
  let s = `<svg width="${W}" height="${H}" role="img" aria-label="${esc(o.label)}">`;
  for(const t of tk) s += `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}"/><text class="axl" x="${m.l - 8}" y="${Y(t) + 4}" text-anchor="end">${o.fy(t)}</text>`;
  s += '<g class="bars">';
  data.forEach((d, i) => {
    const x = m.l + i * cw + (cw - bw) / 2;
    if(d.v > 0){ const y = Y(d.v); s += `<path class="bar" data-i="${i}" d="${barPath(x, y, bw, H - m.b - y, 4)}"/>`; }
    s += `<text class="axl" x="${m.l + i * cw + cw / 2}" y="${H - 8}" text-anchor="middle">${esc(d.l)}</text>`;
  });
  data.forEach((d, i) => s += `<rect class="hit" data-i="${i}" x="${m.l + i * cw}" y="0" width="${cw}" height="${H - m.b}"/>`);
  s += '</g></svg>';
  el.innerHTML = s;
  const g = el.querySelector('.bars');
  g.querySelectorAll('.hit').forEach(r => {
    r.addEventListener('pointermove', e => { const i = +r.dataset.i; g.classList.add('hov'); g.querySelectorAll('.bar').forEach(b => b.classList.toggle('on', +b.dataset.i === i)); tip(e.clientX, e.clientY, o.tt(data[i])); });
    r.addEventListener('pointerleave', () => { g.classList.remove('hov'); untip(); });
  });
}
function drawCharts(){ document.querySelectorAll('[data-ch]').forEach(el => { const c = CH[+el.dataset.ch]; if(c) (c.t === 'line' ? drawLine : drawBars)(el, c.d, c.o); }); }
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(drawCharts, 120); });

/* ================== Adjuntos (fotos y PDF) ================== */
// Van en IndexedDB (localStorage no alcanza para fotos). En el backup viajan como base64.
let idbP = null;
function idb(){ return idbP || (idbP = new Promise((ok, mal) => { const r = indexedDB.open('autocontrol', 1); r.onupgradeneeded = () => r.result.createObjectStore('adjuntos'); r.onsuccess = () => ok(r.result); r.onerror = () => { idbP = null; mal(r.error); }; })); }
async function idbOp(modo, fn){ const db = await idb(); return new Promise((ok, mal) => { const t = db.transaction('adjuntos', modo), r = fn(t.objectStore('adjuntos')); t.oncomplete = () => ok(r.result); t.onerror = t.onabort = () => mal(t.error); }); }
const adjGet = id => idbOp('readonly', st => st.get(id));
const adjPut = (id, b) => idbOp('readwrite', st => st.put(b, id));
const adjDel = id => idbOp('readwrite', st => st.delete(id)).catch(() => {});
const adjVaciar = () => idbOp('readwrite', st => st.clear()).catch(() => {});
const fTam = n => n < 1e6 ? Math.max(1, Math.round(n / 1e3)) + ' KB' : nf1.format(n / 1e6) + ' MB';
const blobB64 = b => new Promise((ok, mal) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = () => mal(r.error); r.readAsDataURL(b); });
function b64Blob(t, tipo){ const bin = atob(t), u = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], {type:tipo}); }
// Las fotos del celular pesan 3-8 MB: se achican a 1800 px en JPEG (se lee bien un papel y ocupa ~400 KB).
async function achicarFoto(f){
  if(!/^image\/(jpeg|png|webp|heic|heif)/.test(f.type)) return f;
  try{
    const bm = await createImageBitmap(f), k = Math.min(1, 1800 / Math.max(bm.width, bm.height));
    if(k === 1 && f.size < 1.5e6) return f;
    const c = document.createElement('canvas'); c.width = Math.round(bm.width * k); c.height = Math.round(bm.height * k);
    c.getContext('2d').drawImage(bm, 0, 0, c.width, c.height);
    const b = await new Promise(r => c.toBlob(r, 'image/jpeg', .85));
    return b && b.size < f.size ? b : f;
  }catch(e){ return f; }
}
async function guardarAdjuntos(x, st){
  if(!st) return;
  const quedan = new Set(st.keep.map(a => a.id));
  (x.adjuntos || []).filter(a => !quedan.has(a.id)).forEach(a => adjDel(a.id));
  const lista = st.keep.slice();
  if(st.nuevos.length) toast('Guardando ' + plural(st.nuevos.length, 'archivo', 'archivos') + '…');
  for(const f of st.nuevos){
    const b = await achicarFoto(f), id = uid(), nombre = b !== f ? f.name.replace(/\.[^.]+$/, '') + '.jpg' : f.name;
    try{ await adjPut(id, b); lista.push({id, nombre, tipo:b.type || f.type, tam:b.size}); }
    catch(e){ toast('No se pudo guardar ' + f.name + '. ¿Hay espacio en el teléfono?', true); }
  }
  x.adjuntos = lista; save(); render();
  if(st.nuevos.length) toast(plural(st.nuevos.length, 'Archivo guardado', 'Archivos guardados'));
}
const THUMB = {};
function miniaturas(){
  document.querySelectorAll('[data-th]').forEach(async el => {
    const id = el.dataset.th; if(!id) return;
    if(!THUMB[id]){ const b = await adjGet(id).catch(() => null); if(!b) return; THUMB[id] = URL.createObjectURL(b); }
    el.style.backgroundImage = `url("${THUMB[id]}")`;
  });
}
function adjuntosHTML(p){
  if(!p.adjuntos || !p.adjuntos.length) return '';
  return `<div class="thumbs">${p.adjuntos.map(a => { const img = /^image\//.test(a.tipo);
    return `<button class="th" data-a="verAdj" data-id="${p.id}|${a.id}"${img ? ` data-th="${a.id}"` : ''} title="${esc(a.nombre)}" aria-label="Ver ${esc(a.nombre)}">${img ? '' : ic('file', 20) + 'PDF'}</button>`; }).join('')}</div>`;
}
function descargarBlob(b, nombre){
  if(window.Android && Android.guardarArchivoB64) return blobB64(b).then(t => Android.guardarArchivoB64(nombre, b.type || 'application/octet-stream', t));
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function abrirBlob(b, nombre){
  if(window.Android && Android.abrirArchivo) return blobB64(b).then(t => Android.abrirArchivo(nombre, b.type || 'application/pdf', t));
  const u = URL.createObjectURL(b); if(!window.open(u, '_blank')) descargarBlob(b, nombre);
}
async function verAdjunto(pid, aid){
  const p = S.papeles.find(x => x.id === pid), a = p && (p.adjuntos || []).find(x => x.id === aid); if(!a) return;
  const b = await adjGet(aid).catch(() => null);
  if(!b) return toast('Este archivo no está en este dispositivo (se cargó en otro). Importá el backup para traerlo.', true);
  const img = /^image\//.test(a.tipo);
  if(img && !THUMB[aid]) THUMB[aid] = URL.createObjectURL(b);
  abrirModal(`<div class="dlg-h"><span class="chip">${ic(img ? 'img' : 'file', 18)}</span><h3>${esc(p.tipo)}</h3><button type="button" class="ibtn" data-a="cerrar" aria-label="Cerrar">${ic('x', 15)}</button></div>
    ${img ? `<div class="visor"><img src="${THUMB[aid]}" alt="${esc(a.nombre)}"></div>` : ''}<p class="sub" style="margin:10px 0 0">${esc(a.nombre)} · ${fTam(a.tam || b.size)}</p>
    <div class="dlg-f"><button type="button" class="btn sec" id="adjBajar">${ic('down', 16)} Descargar</button>${img ? '' : `<button type="button" class="btn primary" id="adjAbrir">${ic('ext', 16)} Abrir PDF</button>`}</div>`, 'tar');
  document.getElementById('adjBajar').onclick = () => descargarBlob(b, a.nombre);
  const ab = document.getElementById('adjAbrir'); if(ab) ab.onclick = () => abrirBlob(b, a.nombre);
}
async function adjuntosParaBackup(){
  const out = {};
  for(const p of S.papeles) for(const a of p.adjuntos || []){ const b = await adjGet(a.id).catch(() => null); if(b) out[a.id] = await blobB64(b); }
  return out;
}
async function restaurarAdjuntos(adj){
  await adjVaciar();
  for(const p of S.papeles) for(const a of p.adjuntos || []) if(adj && adj[a.id]) await adjPut(a.id, b64Blob(adj[a.id], a.tipo)).catch(() => {});
  render();
}

    satelite:L.layerGroup([esri('World_Imagery', {attribution:'© Esri · Maxar · Earthstar Geographics'}), esri('Reference/World_Transportation'), esri('Reference/World_Boundaries_and_Places')]),

const pinIcon = (i, cls = '') => L.divIcon({className:'', html:`<div class="m-pin ${cls}">${ic(i, cls.includes('sel') ? 17 : 14)}</div>`, iconSize:cls.includes('sel') ? [36, 36] : [30, 30], iconAnchor:cls.includes('sel') ? [18, 40] : [15, 34]});
function fetchT(u, ms, op = {}){ const c = new AbortController(), t = setTimeout(() => c.abort(), ms); return fetch(u, {...op, signal:c.signal}).finally(() => clearTimeout(t)); }
const centroMapa = () => G.pos || (M.map ? {lat:M.map.getCenter().lat, lng:M.map.getCenter().lng} : {lat:-34.6037, lng:-58.3816});

function mapaInit(){
  if(!window.L){ toast('No se pudo cargar el mapa. Revisá la conexión a internet.', true); return false; }

    if(M.oscuro !== temaOscuro()){ M.map.removeLayer(M.capas[M.capa]); M.capas = capasBase(); M.capas[M.capa].addTo(M.map); M.oscuro = temaOscuro(); }
    return true;
  }
  // leaflet-rotate: el mapa gira con el rumbo del auto (sin gestos de rotacion, para no girarlo sin querer).
  M.map = L.map('mapaMap', {zoomControl:false, rotate:!!L.Map.prototype.setBearing, rotateControl:false, touchRotate:false, shiftKeyRotate:false, bearing:0}).setView([-34.6037, -58.3816], 12);

  M.trazo = L.layerGroup().addTo(M.map); M.grupo = L.layerGroup().addTo(M.map);
  M.map.on('dragstart', () => {
    M.seguir = false; mapaFab(); clearTimeout(M.volverT);

  } else { M.yo.setLatLng(ll); M.yoAcc.setLatLng(ll).setRadius(p.acc || 0); }

const FLECHA = '<svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="15" fill="#fff"/><path d="M17 5l8.5 21L17 21.5 8.5 26z" fill="#2A78D6" stroke="#2A78D6" stroke-width="1.5" stroke-linejoin="round"/></svg>';
const iconoYo = flecha => flecha ? L.divIcon({className:'', html:'<div class="m-flecha">' + FLECHA + '</div>', iconSize:[34, 34], iconAnchor:[17, 17]})
  : L.divIcon({className:'', html:'<div class="m-yo"></div>', iconSize:[22, 22], iconAnchor:[11, 11]});
const giroMapa = () => M.map && M.map.getBearing ? M.map.getBearing() : 0;
// Gira el mapa de a poco hasta el angulo pedido (por el lado mas corto), asi no salta en cada lectura del GPS.
function girarMapa(b){
  if(!M.map || !M.map.setBearing) return;
  M.giroObj = (b + 360) % 360;
  if(document.hidden){ M.map.setBearing(M.giroObj); return; }
  if(M.giroRaf && Date.now() - M.giroT < 1000) return;
  const paso = () => {
    M.giroT = Date.now();
    const act = giroMapa(), d = ((M.giroObj - act + 540) % 360) - 180;
    if(Math.abs(d) < .5){ M.map.setBearing(M.giroObj); M.giroRaf = 0; return; }
    M.map.setBearing(act + d * .18); M.giroRaf = requestAnimationFrame(paso);
  };
  M.giroT = Date.now(); M.giroRaf = requestAnimationFrame(paso);
}

// Android avisa cuando la app pasa a ventanita flotante (imagen en imagen) o vuelve a pantalla completa.

function mapaSheet(html){ document.getElementById('mapaSheet').innerHTML = html; }
// Encuadra dejando a la vista lo que tapa la barra de busqueda (arriba) y el panel (abajo).
function encuadrar(b, maxZoom = 17){ M.seguir = false; mapaFab(); M.map.fitBounds(b, {paddingTopLeft:[24, 120], paddingBottomRight:[24, document.getElementById('mapaSheet').offsetHeight + 24], maxZoom}); }

const cerrarX = `<button class="ibtn" data-a="mapaLimpiar" aria-label="Cerrar" title="Cerrar">${ic('x', 15)}</button>`;
const distA = r => G.pos ? fDist(hav(G.pos, r)) : '';

/* --- Busqueda --- */
const dirPhoton = p => [[p.street, p.housenumber].filter(Boolean).join(' '), p.locality || p.district, p.city || p.town || p.village, p.state].filter((x, i, a) => x && a.indexOf(x) === i).join(', ');
async function photon(q, extra = {}){
  const u = new URL('https://photon.komoot.io/api/'), c = centroMapa();
  u.searchParams.set('q', q); u.searchParams.set('limit', extra.limit || 12); u.searchParams.set('lang', 'default'); u.searchParams.set('lat', c.lat.toFixed(5)); u.searchParams.set('lon', c.lng.toFixed(5));
  if(extra.bbox) u.searchParams.set('bbox', extra.bbox);
  if(extra.tag) u.searchParams.set('osm_tag', extra.tag);
  const r = await fetchT(u, 12000); if(!r.ok) throw new Error('photon ' + r.status);
  return (await r.json()).features.map(f => {
    const p = f.properties, [lng, lat] = f.geometry.coordinates, calle = [p.street, p.housenumber].filter(Boolean).join(' ');
    return {lat, lng, nombre:p.name || calle || p.city || 'Lugar', dir:dirPhoton(p.name && p.name !== calle ? p : {...p, street:null, housenumber:null})};
  });
}
// Photon mezcla calles con el mismo nombre de todo el pais: se queda con lo cercano

function cercanos(res, q = ''){
  const c = centroMapa(), num = (q.match(/\d+/) || [''])[0], out = [];
  for(const r of res){
    const i = out.findIndex(o => hav(o, r) < 40);
    if(i < 0) out.push(r);
    else if(num && r.nombre.includes(num) && !out[i].nombre.includes(num)) out[i] = r;   // preferir "Av. X 1234" a "Kiosco Pepe"
  }
  for(const lim of [60e3, 400e3]){ const f = out.filter(r => hav(c, r) <= lim); if(f.length) return f; }
  return out;
}
let sugT = 0, sugN = 0;
async function mapaSugerir(q){
  const n = ++sugN; let res;
  try{ res = cercanos(await photon(q), q); }catch(e){ return; }
  if(n !== sugN || M.nav || document.getElementById('mapaQ').value.trim() !== q) return;
  M.grupo.clearLayers(); M.trazo.clearLayers(); M.ruta = null; M.sel = null; M.res = res;
  mapaSheet(listaHTML('Sugerencias', res, 'pin'));
}
async function mapaBuscar(q, nombre, ir){
  ++sugN; clearTimeout(sugT);
  mapaLimpiar(); document.getElementById('mapaQ').value = q;
  mapaSheet(`<div class="ms-h"><b>Buscando…</b>${cerrarX}</div><p class="ms-sub">${esc(q)}</p>`);
  let res; try{ res = cercanos(await photon(q), q); }catch(e){ return mapaSheet(`<div class="ms-h"><b>No se pudo buscar</b>${cerrarX}</div><p class="ms-sub">Revisá la conexión a internet y probá de nuevo.</p>`); }
  if(nombre && res.length){ const r = {...res[0], nombre, dir:res[0].dir || q}; mapaLugar(r); if(ir) mapaRuta(r, ir); return; }
  if(res.length === 1) return mapaLugar(res[0]);
  mapaLista(`Resultados para “${q}”`, res, 'pin', false);
}
const listaHTML = (titulo, res, icono) => `<div class="ms-h"><b>${esc(titulo)}</b>${cerrarX}</div>${res.length
  ? `<div class="ms-list">${res.map((r, i) => `<button class="ms-li" data-a="mapaRes" data-id="${i}"><span class="chip">${ic(icono, 16)}</span><span class="grow"><b>${esc(r.nombre)}</b><small>${esc([distA(r), r.dir].filter(Boolean).join(' · '))}</small></span></button>`).join('')}</div>`
  : '<p class="ms-sub">No encontré resultados por acá. Probá agregando la localidad (ej: "Mitre 1234, Avellaneda").</p>'}`;
function mapaLista(titulo, res, icono, ordenar = true){

  M.res = res;

  if(res.length){ const b = L.latLngBounds(res.slice(0, 12).map(r => [r.lat, r.lng])); if(G.pos) b.extend([G.pos.lat, G.pos.lng]); encuadrar(b, 16); }

    <div class="ms-acc">${pie ? btn('Ir caminando', 'walk', 'mapaIr', '', 'foot') + btnS('En auto', 'car', 'mapaIr', '', 'driving') : btn('Cómo llegar', 'nav', 'mapaIr', '', 'driving') + btnS('A pie', 'walk', 'mapaIr', '', 'foot')}</div>`);

/* --- Lugares cercanos --- */
const OVERPASS = ['https://overpass-api.de/api/interpreter', 'https://overpass.private.coffee/api/interpreter', 'https://maps.mail.ru/osm/tools/overpass/api/interpreter'];
async function overpass(c, p){
  const q = `[out:json][timeout:15];nwr${c.osm}(around:5000,${p.lat.toFixed(5)},${p.lng.toFixed(5)});out center 40;`;
  for(const u of OVERPASS){
    try{
      const r = await fetchT(u, 14000, {method:'POST', body:'data=' + encodeURIComponent(q), headers:{'Content-Type':'application/x-www-form-urlencoded'}});
      if(!r.ok) continue;
      return (await r.json()).elements.map(e => {
        const t = e.tags || {}, lat = e.lat != null ? e.lat : e.center && e.center.lat, lng = e.lon != null ? e.lon : e.center && e.center.lon;
        return {lat, lng, nombre:t.name || t.brand || t.operator || c.u, dir:[[t['addr:street'], t['addr:housenumber']].filter(Boolean).join(' '), t['addr:city']].filter(Boolean).join(', ')};
      }).filter(x => x.lat != null);
    }catch(e){}
  }
  throw new Error('overpass');
}
async function cercaPhoton(c, p){
  const d = .045, bbox = [p.lng - d, p.lat - d, p.lng + d, p.lat + d].map(x => x.toFixed(4)).join(','), vistos = new Set(), out = [];
  for(const q of c.txt){
    for(const r of await photon(q, {bbox, tag:c.tag, limit:20}).catch(() => [])){
      const k = r.lat.toFixed(4) + ',' + r.lng.toFixed(4); if(!vistos.has(k)){ vistos.add(k); out.push(r); }
    }
    if(out.length >= 15) break;
  }
  return out;
}
async function mapaCerca(k){
  const c = CERCA.find(x => x.k === k); if(!c) return;
  const p = centroMapa();
  mapaLimpiar(); M.seguir = false; mapaFab();
  mapaSheet(`<div class="ms-h"><b>Buscando ${esc(c.l.toLowerCase())}…</b>${cerrarX}</div><p class="ms-sub">${G.pos ? 'Alrededor tuyo' : 'Alrededor del centro del mapa'}</p>`);
  let res = [];
  try{ res = await overpass(c, p); }catch(e){}
  if(!res.length) res = await cercaPhoton(c, p);
  mapaLista(c.l + ' cerca', res.slice(0, 40), c.i);
}

/* --- Rutas y navegacion --- */
const GIRO = {'uturn':'en U', 'sharp right':'cerrado a la derecha', 'right':'a la derecha', 'slight right':'levemente a la derecha', 'straight':'derecho', 'slight left':'levemente a la izquierda', 'left':'a la izquierda', 'sharp left':'cerrado a la izquierda'};
const ROT = {'sharp right':135, 'right':90, 'slight right':45, 'straight':0, 'slight left':-45, 'left':-90, 'sharp left':-135};
function instruccion(s){
  const m = s.maneuver, t = m.type, mod = m.modifier || 'straight', calle = s.name || s.ref || '', por = calle ? ' por ' + calle : '', en = calle ? ' en ' + calle : '', dir = GIRO[mod] || '';
  if(t === 'depart') return 'Salí' + por;
  if(t === 'arrive') return 'Llegaste a destino';
  if(t === 'roundabout' || t === 'rotary') return `En la rotonda tomá la ${m.exit || 1}ª salida` + (calle ? ' hacia ' + calle : '');
  if(t === 'exit roundabout' || t === 'exit rotary') return 'Salí de la rotonda' + por;
  if(mod === 'uturn') return 'Pegá la vuelta en U' + por;
  if(t === 'fork') return `En la bifurcación mantenete ${dir}` + por;
  if(t === 'off ramp') return `Tomá la salida ${dir}` + (calle ? ' hacia ' + calle : '');
  if(t === 'on ramp') return 'Tomá el acceso' + (calle ? ' a ' + calle : '');
  if(t === 'merge') return 'Incorporate' + por;
  if(mod === 'straight' || t === 'new name' || t === 'continue') return 'Seguí derecho' + por;
  if(t === 'end of road') return `Al final de la calle doblá ${dir}` + en;
  return `Doblá ${dir}` + en;
}
const icoPaso = p => p.tipo === 'arrive' ? ['flag', 0] : p.mod === 'uturn' ? ['uturn', 0] : /roundabout|rotary/.test(p.tipo) && p.tipo.indexOf('exit') < 0 ? ['round', 0] : ['flecha', ROT[p.mod] || 0];
async function osrm(a, b, modo){
  const prof = modo === 'foot' ? 'routed-foot/route/v1/foot' : 'routed-car/route/v1/driving';
  const u = `https://routing.openstreetmap.de/${prof}/${a.lng.toFixed(6)},${a.lat.toFixed(6)};${b.lng.toFixed(6)},${b.lat.toFixed(6)}?overview=full&geometries=geojson&steps=true`;
  const r = await fetchT(u, 15000); const j = await r.json();
  if(j.code !== 'Ok' || !j.routes || !j.routes.length) throw new Error(j.code || 'ruta');
  const rt = j.routes[0];
  return {dist:rt.distance, dur:rt.duration, linea:rt.geometry.coordinates.map(c => [c[1], c[0]]),
    pasos:rt.legs[0].steps.map(s => ({ins:instruccion(s), dist:s.distance, loc:{lat:s.maneuver.location[1], lng:s.maneuver.location[0]}, tipo:s.maneuver.type, mod:s.maneuver.modifier || ''}))};
}
const fDurC = s => { s = Math.round(s / 60); return s < 60 ? Math.max(1, s) + ' min' : Math.floor(s / 60) + ' h ' + String(s % 60).padStart(2, '0') + ' min'; };
const fHora = ms => { const d = new Date(ms); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
async function mapaRuta(dest, modo = 'driving'){
  dest = dest || M.sel; if(!dest) return;
  M.sel = dest; M.modo = modo;
  if(!G.pos){ M.pendiente = [dest, modo]; mapaSeguirPos(); return mapaSheet(`<div class="ms-h"><b>Buscando tu ubicación…</b>${cerrarX}</div><p class="ms-sub">Apenas el GPS te ubique calculo la ruta a ${esc(dest.nombre)}.</p>`); }
  mapaSheet(`<div class="ms-h"><b>Calculando ruta…</b>${cerrarX}</div><p class="ms-sub">${esc(dest.nombre)}</p>`);
  try{ M.ruta = await osrm(G.pos, dest, modo); }
  catch(e){ return mapaSheet(`<div class="ms-h"><b>No pude calcular la ruta</b>${cerrarX}</div><p class="ms-sub">Revisá la conexión a internet y probá de nuevo.</p><div class="ms-acc">${btn('Reintentar', 'refresh', 'mapaIr', '', modo)}</div>`); }
  rutaSheet(); dibujarRuta(true);
}
function dibujarRuta(ver){
  const rt = M.ruta; M.trazo.clearLayers();
  L.polyline(rt.linea, {color:'#fff', weight:9, opacity:.9, interactive:false}).addTo(M.trazo);
  L.polyline(rt.linea, {color:AZUL, weight:6, opacity:1, interactive:false, dashArray:M.modo === 'foot' ? '2 9' : null}).addTo(M.trazo);
  if(ver) encuadrar(L.latLngBounds(rt.linea));
}
function rutaSheet(){
  const rt = M.ruta, d = M.sel, pie = M.modo === 'foot';
  mapaSheet(`<div class="ms-h"><b>${esc(d.nombre)}</b>${cerrarX}</div>
    <div class="ms-modo"><button data-a="mapaIr" data-id="driving" class="${pie ? '' : 'on'}">${ic('car', 16)} En auto</button><button data-a="mapaIr" data-id="foot" class="${pie ? 'on' : ''}">${ic('walk', 16)} A pie</button></div>
    <p class="ms-sub"><b style="color:var(--tx);font-size:18px">${fDurC(rt.dur)}</b> · ${fDist(rt.dist)} · llegás ${fHora(Date.now() + rt.dur * 1000)}</p>
    <div class="ms-acc">${btn('Iniciar', 'nav', 'mapaNav')}</div>
    <details class="ms-pasos"><summary>Ver indicaciones (${rt.pasos.length})</summary><ol>${rt.pasos.map(p => `<li><b>${esc(p.ins)}</b>${p.dist > 0 ? ' · ' + fDist(p.dist) : ''}</li>`).join('')}</ol></details>`);
}
function hablar(t){
  if(!M.voz) return;
  try{ if(window.Android && Android.hablar) return Android.hablar(t); }catch(e){}
  try{ const u = new SpeechSynthesisUtterance(t); u.lang = 'es-AR'; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){}
}
function navIniciar(){
  if(!M.ruta || !G.pos) return;
  M.nav = {i:Math.min(1, M.ruta.pasos.length - 1), dicho:-1}; M.seguir = true; M.rerutaT = Date.now();
  document.getElementById('mapa').classList.add('navegando'); pedirWake();

  M.map.setView([G.pos.lat, G.pos.lng], 17);
  hablar(M.ruta.pasos[0].ins + (M.ruta.pasos[1] ? '. Después, ' + M.ruta.pasos[1].ins.charAt(0).toLowerCase() + M.ruta.pasos[1].ins.slice(1) : ''));

function navFin(silencio){

// Distancia (m) del punto a la ruta, en plano local: alcanza para detectar si te desviaste.
function distRuta(p, linea){
  const k = Math.cos(p.lat * RAD) * 111320, X = q => (q[1] - p.lng) * k, Y = q => (q[0] - p.lat) * 110540; let min = Infinity;
  for(let i = 1; i < linea.length; i++){
    const ax = X(linea[i-1]), ay = Y(linea[i-1]), bx = X(linea[i]), by = Y(linea[i]), dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy;
    const t = l ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / l)) : 0;
    min = Math.min(min, Math.hypot(ax + t * dx, ay + t * dy));
  }
  return min;
}
async function navPaso(){
  const n = M.nav, rt = M.ruta, p = G.pos; if(!n || !rt || !p) return;
  const ps = rt.pasos;
  while(n.i < ps.length - 1 && hav(p, ps[n.i].loc) < (M.modo === 'foot' ? 12 : 25)) n.i++;
  const sig = ps[n.i], dSig = hav(p, sig.loc);
  if(sig.tipo === 'arrive' && dSig < 30){ hablar('Llegaste a destino'); const d = M.sel; navFin(true); M.trazo.clearLayers(); M.ruta = null; toast('Llegaste a ' + d.nombre); return mapaLugar(d, M.modo); }
  // Desvio: recalcular la ruta (como mucho cada 15 s).
  if(p.acc < 50 && distRuta(p, rt.linea) > 45 + p.acc / 2 && Date.now() - M.rerutaT > 15000){
    M.rerutaT = Date.now();
    try{ const nr = await osrm(p, M.sel, M.modo); if(!M.nav) return; M.ruta = nr; M.nav.i = Math.min(1, nr.pasos.length - 1); M.nav.dicho = -1; dibujarRuta(false); hablar('Recalculando ruta'); return navPaso(); }catch(e){}
  }
  const resto = dSig + ps.slice(n.i).reduce((s, x) => s + x.dist, 0), seg = rt.dur * resto / Math.max(1, rt.dist);
  const aviso = M.modo === 'foot' ? 40 : (p.speed && p.speed > 17 ? 400 : 180);
  if(n.dicho !== n.i && dSig < aviso){ n.dicho = n.i; hablar(sig.tipo === 'arrive' ? `En ${Math.round(dSig / 10) * 10} metros llegás a destino` : `En ${Math.round(dSig / 10) * 10} metros, ${sig.ins.charAt(0).toLowerCase() + sig.ins.slice(1)}`); }
  const [ico, rot] = icoPaso(sig);
  mapaSheet(`<div class="nav-ins"><span class="nav-fl" style="--rot:${rot}deg">${ic(ico, 30)}</span><div><div class="nav-d">${fDist(Math.round(dSig / 10) * 10)}</div><div class="nav-t">${esc(sig.ins)}</div></div></div>
    <div class="nav-pie"><div class="grow"><b>${fDurC(seg)}</b> · ${fDist(resto)}<div class="meta">Llegada ${fHora(Date.now() + seg * 1000)}</div></div>
      <button class="ibtn" data-a="mapaVoz" aria-label="${M.voz ? 'Silenciar voz' : 'Activar voz'}" title="${M.voz ? 'Silenciar voz' : 'Activar voz'}">${ic(M.voz ? 'vol' : 'volx', 16)}</button>
      ${btn('Salir', 'x', 'mapaNavFin', '', '', 'danger')}</div>`);
}

/* ================== GPS ================== */
const G = {watch:null, timer:null, wake:null, pos:null, err:'', mapaT:0};
const RAD = Math.PI / 180;
function hav(a, b){
  const dLat = (b.lat - a.lat) * RAD, dLng = (b.lng - a.lng) * RAD;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * RAD) * Math.cos(b.lat * RAD) * Math.sin(dLng / 2) ** 2;
  return 2 * 6371000 * Math.asin(Math.sqrt(x));
}
const gpsOn = () => G.watch != null;
// Rumbo en grados desde el norte (sentido horario) entre dos puntos.
function rumboEntre(a, b){
  const f1 = a.lat * RAD, f2 = b.lat * RAD, dl = (b.lng - a.lng) * RAD;
  return (Math.atan2(Math.sin(dl) * Math.cos(f2), Math.cos(f1) * Math.sin(f2) - Math.sin(f1) * Math.cos(f2) * Math.cos(dl)) / RAD + 360) % 360;
}
// Posicion nueva con rumbo: el que da el GPS si vas andando; si no, el calculado contra el ultimo punto
// alejado unos metros (parado el GPS tiembla y el rumbo daria cualquier cosa, entonces se mantiene el anterior).
function posGps(c, t){
  const prev = G.pos, p = {lat:c.latitude, lng:c.longitude, acc:c.accuracy, speed:c.speed, t, rumbo:prev ? prev.rumbo : null, ref:prev ? prev.ref : null};
  const movio = !p.ref || hav(p.ref, p) > Math.max(8, Math.min(c.accuracy || 0, 30) * .5);
  if(c.heading != null && !isNaN(c.heading) && c.speed > 1.5) p.rumbo = c.heading;
  else if(p.ref && movio && c.accuracy < 40 && !(c.speed != null && c.speed < .8)) p.rumbo = rumboEntre(p.ref, p);
  if(movio) p.ref = {lat:p.lat, lng:p.lng};
  return p;
}
const fDist = m => m < 1000 ? Math.round(m) + ' m' : nf2.format(m / 1000) + ' km';
function fDur(s){ s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h} h ${String(m).padStart(2, '0')} min` : `${m} min ${String(s % 60).padStart(2, '0')} s`; }
function fFH(ts){ const d = new Date(ts); return fF(iso(d)) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function gpsDisponible(){
  if(!('geolocation' in navigator)){ toast('Este navegador no tiene acceso al GPS.', true); return false; }
  if(!window.isSecureContext){ toast('El GPS solo funciona si la app se abre desde una dirección https o como archivo local.', true); return false; }
  return true;
}
function gpsIniciar(continuar){
  if(gpsOn()) return A.ir('gps');
  const v = V(); if(!v) return toast('Primero cargá un vehículo', true);
  if(!continuar && S.gpsActivo){ A.ir('gps'); return toast('Tenés un recorrido sin terminar: continualo o guardalo primero.', true); }
  if(!gpsDisponible()) return;
  if(!continuar || !S.gpsActivo) S.gpsActivo = {vid:v.id, inicio:Date.now(), base:kmActual(v), dist:0, puntos:[], last:null};
  G.err = ''; G.mapaT = 0;
  G.watch = navigator.geolocation.watchPosition(gpsPos, gpsErr, {enableHighAccuracy:true, maximumAge:0, timeout:20000});
  G.timer = setInterval(gpsLive, 1000);
  pedirWake(); save(); UI.sec = 'gps'; cerrarMenu(); render();
  toast('GPS activado. Dejá la app abierta mientras manejás.');
}
function gpsDetener(){
  if(G.watch != null) navigator.geolocation.clearWatch(G.watch);
  G.watch = null; clearInterval(G.timer); G.timer = null; if(!M.nav) soltarWake();
  if(mapaVisible()) mapaSeguirPos();
}
function gpsPos(p){
  const c = p.coords, pt = {lat:c.latitude, lng:c.longitude, t:p.timestamp || Date.now()};
  G.pos = posGps(c, pt.t); G.err = ''; mapaPos();
  const a = S.gpsActivo; if(!a || !gpsOn()) return;
  if(c.accuracy > 50) return gpsLive();               // señal mala: no se cuenta
  if(!a.last){ a.last = pt; a.puntos.push([+pt.lat.toFixed(6), +pt.lng.toFixed(6)]); persistir(); return gpsLive(); }
  const d = hav(a.last, pt), dt = Math.max(.001, (pt.t - a.last.t) / 1000);
  // Filtro de "temblor": parado, el GPS salta unos metros y sumaria km falsos.
  // Se acumula desde el ultimo punto aceptado, asi que el movimiento lento igual cuenta.
  if(d < Math.max(10, c.accuracy * .6)) return gpsLive();
  if(c.speed != null && c.speed < .8 && d < c.accuracy * 1.5) return gpsLive();
  if(d / dt > 70) return gpsLive();                   // salto imposible (> 250 km/h)
  a.dist += d; a.last = pt;
  const lp = a.puntos[a.puntos.length-1];
  if(!lp || hav({lat:lp[0], lng:lp[1]}, pt) >= 30) a.puntos.push([+pt.lat.toFixed(6), +pt.lng.toFixed(6)]);
  if(a.puntos.length > 1500) a.puntos = simplificar(a.puntos, 750);
  persistir(); gpsLive();
}
let persistT = 0;
function persistir(){ if(Date.now() - persistT > 8000){ persistT = Date.now(); save(); } }
function gpsErr(e){
  if(e.code === 1){ gpsDetener(); save(); render(); toast('No diste permiso para usar la ubicación. Habilitalo en el navegador (ícono del candado) y probá de nuevo.', true); return; }
  G.err = e.code === 3 ? 'Esperando señal…' : 'Sin señal de GPS'; gpsLive();
}
function gpsLive(){
  const a = S.gpsActivo, set = (id, t) => { const e = document.getElementById(id); if(e) e.textContent = t; };
  if(a){
    const s = (Date.now() - a.inicio) / 1000, km = a.dist / 1000;

    mapaOdo(); set('gpsTiempo', fDur(s)); set('gpsProm', s > 60 && km > .05 ? nf.format(Math.round(km / (s / 3600))) + ' km/h' : '—');

      if(a && a.puntos.length > 1){ const pts = a.puntos.concat([ll]); if(mm.ln) mm.ln.setLatLngs(pts); else mm.ln = L.polyline(pts, {color:VERDE, weight:4, interactive:false}).addTo(mm.map); }
      mm.map.setView(ll, mm.map.getZoom() < 10 ? 16 : mm.map.getZoom(), {animate:false}); }

async function pedirWake(){ try{ if(window.Android && Android.pantalla) Android.pantalla(true); }catch(e){} try{ if('wakeLock' in navigator && document.visibilityState === 'visible') G.wake = await navigator.wakeLock.request('screen'); }catch(e){} }
function soltarWake(){ try{ if(window.Android && Android.pantalla) Android.pantalla(false); }catch(e){} try{ if(G.wake) G.wake.release(); }catch(e){} G.wake = null; }

function simplificar(pts, max){
  if(pts.length <= max) return pts;
  const step = (pts.length - 1) / (max - 1), out = [];
  for(let i = 0; i < max; i++) out.push(pts[Math.round(i * step)]);
  return out;
}
function gpsTerminar(){

function ubicacionActual(fn){

function miniRuta(pts){
  if(!pts || pts.length < 2) return `<span class="chip">${ic('nav', 17)}</span>`;
  const c = Math.cos(pts[0][0] * RAD), xs = pts.map(p => p[1] * c), ys = pts.map(p => -p[0]);
  const x0 = Math.min(...xs), y0 = Math.min(...ys), w = Math.max(...xs) - x0, h = Math.max(...ys) - y0, sc = 48 / Math.max(w, h, 1e-9);
  const ox = 8 + (48 - w * sc) / 2, oy = 8 + (48 - h * sc) / 2;
  const P = xs.map((x, i) => [(ox + (x - x0) * sc).toFixed(1), (oy + (ys[i] - y0) * sc).toFixed(1)]);
  return `<svg class="ruta" width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><polyline points="${P.map(p => p.join(',')).join(' ')}"/><circle cx="${P[P.length-1][0]}" cy="${P[P.length-1][1]}" r="3.5"/></svg>`;
}

const FF = {};   // adjuntos del formulario abierto: {campo: {keep:[guardados], nuevos:[File]}}
function campoHTML(f, val){
  const id = 'f_' + f.k; let inp;
  switch(f.t){
    case 'files': FF[f.k] = {keep:(val || []).slice(), nuevos:[]}; inp = `<div class="adj" id="${id}"></div>`; break;
    case 'select': inp = `<select id="${id}">${f.opts.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}"${String(val ?? '') === String(v) ? ' selected' : ''}>${esc(l)}</option>`; }).join('')}</select>`; break;
    case 'textarea': inp = `<textarea id="${id}" rows="${f.rows || 2}" placeholder="${esc(f.ph || '')}">${esc(val ?? '')}</textarea>`; break;
    case 'checkbox': return `<label class="chk${f.half ? ' half' : ''}"><input type="checkbox" id="${id}" ${val ? 'checked' : ''}> ${esc(f.l)}</label>`;
    case 'checks': inp = `<div class="checks" id="${id}">${f.opts.length ? f.opts.map(([v, l]) => `<label class="chip-chk"><input type="checkbox" value="${esc(v)}" ${(val || []).includes(v) ? 'checked' : ''}><span>${esc(l)}</span></label>`).join('') : '<span class="muted">No hay ítems en el plan de service.</span>'}</div>`; break;
    case 'date': inp = `<input type="date" id="${id}" value="${esc(val || '')}">`; break;
    case 'km': inp = `<input type="text" inputmode="numeric" id="${id}" value="${val != null && val !== '' ? nf.format(val) : ''}" placeholder="${esc(f.ph || 'Ej: 45.000')}">`; break;
    case 'money': inp = `<input type="text" inputmode="decimal" id="${id}" value="${val ? centsToInput(val) : ''}" placeholder="0,00">`; break;
    case 'dec': inp = `<input type="text" inputmode="decimal" id="${id}" value="${val != null && val !== '' ? String(val).replace('.', ',') : ''}" placeholder="${esc(f.ph || '')}">`; break;
    case 'int': inp = `<input type="number" id="${id}" value="${val ?? ''}" min="${f.min ?? 0}" step="1" placeholder="${esc(f.ph || '')}">`; break;
    default: inp = `<input type="${f.t === 'tel' ? 'tel' : 'text'}" id="${id}" value="${esc(val ?? '')}" placeholder="${esc(f.ph || '')}"${f.upper ? ' style="text-transform:uppercase"' : ''}${f.list ? ` list="dl_${f.k}"` : ''}>${f.list ? `<datalist id="dl_${f.k}">${f.list.map(o => `<option value="${esc(o)}">`).join('')}</datalist>` : ''}`;
  }
  return `<div class="field${f.half ? ' half' : ''}"><label for="${id}">${esc(f.l)}${f.req ? ' <span class="req">*</span>' : ''}</label>${inp}${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}<div class="ferr" id="e_${f.k}"></div></div>`;
}
function leer(f){
  const el = document.getElementById('f_' + f.k), raw = el.value;
  switch(f.t){
    case 'files': return FF[f.k];
    case 'checkbox': return el.checked;
    case 'checks': return [...el.querySelectorAll('input:checked')].map(i => i.value);
    case 'km': return parseKm(raw);
    case 'money': return parseMonto(raw);
    case 'dec': return parseDec(raw);
    case 'int': return raw === '' ? null : (Number.isInteger(+raw) && +raw >= (f.min ?? 0) ? +raw : NaN);
    default: { const s = raw.trim(); return f.upper ? s.toUpperCase() : s; }
  }
}

function abrirForm({titulo, icono, color, campos, valores = {}, onSave, guardar = 'Guardar'}){
  abrirModal(`<form novalidate><div class="dlg-h"><span class="chip">${ic(icono, 18)}</span><h3>${esc(titulo)}</h3><button type="button" class="ibtn" data-a="cerrar" aria-label="Cerrar">${ic('x', 15)}</button></div>
    <div class="fgrid">${campos.map(f => campoHTML(f, valores[f.k])).join('')}</div>
    <div class="dlg-f"><button type="button" class="btn sec" data-a="cerrar">Cancelar</button><button type="submit" class="btn primary">${ic('check', 16)} ${esc(guardar)}</button></div></form>`, color);
  const form = modalEl.querySelector('form'), oculto = f => { const el = document.getElementById('f_' + f.k); return !!(el && el.closest('[hidden]')); };
  campos.filter(f => f.t === 'files').forEach(f => pintarAdj(f.k));
  // Campos que aparecen segun otro (ej: "Otro" en el tipo de papel)
  const visibles = () => { const d = {}; campos.forEach(f => { if(f.t !== 'files') d[f.k] = leer(f); });
    campos.forEach(f => { if(f.si){ const el = document.getElementById('f_' + f.k).closest('.field,.chk'); el.hidden = !f.si(d); } }); };
  if(campos.some(f => f.si)){ form.addEventListener('input', visibles); form.addEventListener('change', visibles); visibles(); }
  form.addEventListener('submit', e => {
    e.preventDefault(); const vals = {}; let ok = true;
    for(const f of campos){
      if(oculto(f)){ vals[f.k] = null; continue; }
      const v = leer(f), err = document.getElementById('e_' + f.k); if(err) err.textContent = '';
      let msg = '';
      if(typeof v === 'number' && isNaN(v)) msg = 'Revisá este número.';
      else if(f.req && (v === '' || v == null || (f.t === 'money' && !v))) msg = 'Este dato es obligatorio.';
      if(msg){ ok = false; if(err) err.textContent = msg; }
      vals[f.k] = v;

function eliminar(col, id){
  const x = S[col].find(i => i.id === id); if(!x) return;
  let extra = '';
  if(col === 'vehiculos') extra = ' También se borran su kilometraje, recorridos, service, historial, cargas, patentes, papeles y gastos.';
  if(col === 'mecanicos') extra = ' Los trabajos que hizo quedan en el historial con su nombre.';
  if(col === 'viajes' && x.kmId && S.km.some(k => k.id === x.kmId)) extra = ' También se borra la lectura de kilometraje que generó.';
  confirmar('Eliminar', `¿Seguro que querés eliminar ${NOMBRE[col]}?${extra}`, 'Eliminar', () => {
    if(col === 'papeles') (x.adjuntos || []).forEach(a => adjDel(a.id));
    if(col === 'vehiculos'){
      S.papeles.filter(p => p.vid === id).forEach(p => (p.adjuntos || []).forEach(a => adjDel(a.id)));
      COLS.filter(c => c !== 'vehiculos' && c !== 'mecanicos').forEach(c => S[c] = S[c].filter(i => i.vid !== id)); if(S.vid === id) S.vid = null;
      if(S.gpsActivo && S.gpsActivo.vid === id){ gpsDetener(); S.gpsActivo = null; }
    }
    if(col === 'viajes' && x.kmId) S.km = S.km.filter(k => k.id !== x.kmId);
    if(col === 'mecanicos') S.historial.forEach(h => { if(h.mecanicoId === id){ h.tallerTexto = x.nombre; h.mecanicoId = ''; } });
    if(col === 'plan') S.historial.forEach(h => { if(h.items) h.items = h.items.filter(i => i !== id); });
    S[col] = S[col].filter(i => i.id !== id);
    if(!V()) S.vid = S.vehiculos[0] ? S.vehiculos[0].id : null;
    toast('Eliminado');
  });
}
