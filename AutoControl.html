    const v = V(); if(!v) return toast('Primero cargá un vehículo', true);
    const y = new Date().getFullYear();
    abrirForm({titulo:'Cargar patente del año', icono:'cal', color:'pre', guardar:'Crear', valores:{forma:'cuotas', anio:y, cantidad:5, cada:'2', primera:`${y}-02-15`, venceAnual:`${y}-02-15`},
      campos:[{k:'forma', l:'Cómo la pagás', t:'select', half:1, opts:[['cuotas','En cuotas'],['anual','Pago anual (una sola vez)']]}, {k:'anio', l:'Año', t:'int', req:1, half:1, min:1900},
        {k:'cantidad', l:'Cantidad de cuotas', t:'int', req:1, half:1, min:1, si:d => d.forma === 'cuotas'},
        {k:'cada', l:'Frecuencia', t:'select', half:1, opts:[['1','Mensual'],['2','Bimestral'],['3','Trimestral'],['4','Cuatrimestral'],['6','Semestral']], si:d => d.forma === 'cuotas'},
        {k:'primera', l:'Vencimiento de la primera', t:'date', req:1, half:1, si:d => d.forma === 'cuotas'},
        {k:'monto', l:'Monto de cada cuota', t:'money', half:1, hint:'Lo podés ajustar después en cada cuota.', si:d => d.forma === 'cuotas'},
        {k:'venceAnual', l:'Vencimiento del pago anual', t:'date', req:1, half:1, si:d => d.forma === 'anual'},
        {k:'montoAnual', l:'Monto total', t:'money', half:1, hint:'Con el descuento por pago anual, si tiene.', si:d => d.forma === 'anual'}],
      onSave(d){
        // Si cambiaron el año y no la fecha, la fecha pasa a ese año (la patente 2027 vence en 2027).
        const alAnio = f => f && f.slice(0, 4) !== String(d.anio) ? d.anio + f.slice(4).replace('-02-29', '-02-28') : f;
        d.primera = alAnio(d.primera); d.venceAnual = alAnio(d.venceAnual);
        const ex = new Set(S.patentes.filter(c => c.vid === v.id && c.anio === d.anio).map(c => c.cuota));
        if(d.forma === 'anual'){
          if(ex.has(0)) return `Ya cargaste el pago anual de ${d.anio}.`;
          S.patentes.push({id:uid(), ts:Date.now(), vid:v.id, anio:d.anio, cuota:0, vence:d.venceAnual, monto:d.montoAnual, pagado:null});
          return void toast(`Pago anual ${d.anio} cargado` + (ex.size ? '. Ojo: ese año también tiene cuotas cargadas.' : ''));
        }
        if(d.cantidad > 24) return 'Son demasiadas cuotas.';
        let n = 0;
        for(let i = 0; i < d.cantidad; i++) if(!ex.has(i + 1)){ S.patentes.push({id:uid(), vid:v.id, anio:d.anio, cuota:i + 1, vence:addMonths(d.primera, i * +d.cada), monto:d.monto, pagado:null}); n++; }
        toast(n ? `Se crearon ${n} cuotas` : 'Esas cuotas ya existían');
      }});
  },
  pagar:(id) => { const c = S.patentes.find(x => x.id === id); if(!c) return; c.pagado = c.pagado ? null : hoy(); save(); render(); toast(c.pagado ? 'Cuota marcada como pagada' : 'Cuota pendiente otra vez'); },
  renovar:(id) => {
    const p = S.papeles.find(x => x.id === id); if(!p) return;
    const meses = p.desde && p.vence ? Math.max(1, Math.round((pd(p.vence) - pd(p.desde)) / 864e5 / 30.44)) : 12;
    FORMS.papeles(null, {tipo:p.tipo, vid:p.vid || '', entidad:p.entidad, numero:p.numero, desde:p.vence, vence:addMonths(p.vence, meses), monto:p.monto, moneda:p.moneda, notas:p.notas});
  },
  verAdj:(id) => { const [p, a] = id.split('|'); verAdjunto(p, a); },
  verMec:(id) => { UI.hmec = id; UI.htipo = ''; UI.hq = ''; A.ir('historial'); },
  tema:(id) => { S.tema = id; save(); render(); },
  exportar:async () => {
    S.ultimoBackup = hoy(); save();
    const txt = JSON.stringify({...S, _adjuntos:await adjuntosParaBackup()});
    // En la app de Android no hay descargas: la app nativa pregunta dónde guardar el archivo.
    if(window.Android && Android.guardarArchivo){ Android.guardarArchivo(`autocontrol-backup-${hoy()}.json`, txt); return render(); }
    const blob = new Blob([txt], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `autocontrol-backup-${hoy()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    render(); toast('Backup descargado');
  },
  importar:() => document.getElementById('fileImp').click(),
  borrarTodo:() => confirmar('Borrar todos los datos', 'Se van a eliminar todos los vehículos y registros de este navegador. Te conviene exportar un backup antes.', 'Borrar todo', () => { const t = S.tema; S = blank(); S.tema = t; UI.sec = 'resumen'; adjVaciar(); toast('Datos borrados'); }),
  gpsIniciar:() => gpsIniciar(false),
  gpsContinuar:() => gpsIniciar(true),
  gpsTerminar:() => gpsTerminar(),
  gpsDescartar:() => confirmar('Descartar recorrido', 'Se pierde lo que midió el GPS en este recorrido. El kilometraje del auto no cambia.', 'Descartar', () => { S.gpsActivo = null; toast('Recorrido descartado'); }),
  gpsTop:() => gpsOn() || S.gpsActivo ? A.ir('gps') : gpsIniciar(false),
  estacione:() => ubicacionActual(p => { S.estacionado = {lat:+p.lat.toFixed(6), lng:+p.lng.toFixed(6), acc:p.acc, ts:Date.now()}; save(); render(); toast('Listo, guardé dónde estacionaste'); }),
  olvidarAuto:() => { S.estacionado = null; save(); render(); },
  mapaMec:(id) => { const m = S.mecanicos.find(x => x.id === id); if(m) mapaMecanico(m); },
  irMec:(id) => { const m = S.mecanicos.find(x => x.id === id); if(m) mapaMecanico(m, 'driving'); },
  mapaAbrir:() => mapaAbrir(),
  mapaCerrar:() => { if(history.state && history.state.mapa) history.back(); else mapaCerrar(); },
  mapaCerca:(k) => mapaVisible() ? mapaCerca(k) : mapaAbrir({cerca:k}),
  mapaRes:(i) => mapaLugar(M.res[+i]),
  mapaIr:(modo) => mapaRuta(M.sel, modo || 'driving'),
  mapaNav:() => navIniciar(),
  mapaNavFin:() => navFin(),
  mapaVoz:() => { M.voz = !M.voz; if(!M.voz) try{ speechSynthesis.cancel(); }catch(e){} navPaso(); },
  mapaCapa:() => { M.map.removeLayer(M.capas[M.capa]); M.capa = M.capa === 'calles' ? 'satelite' : 'calles'; M.capas[M.capa].addTo(M.map);
    const b = document.getElementById('mapaCapaBtn'), t = M.capa === 'calles' ? 'Ver satélite' : 'Ver mapa de calles'; b.title = t; b.setAttribute('aria-label', t); },
  mapaRumbo:() => { M.rumboAuto = !M.rumboAuto; if(M.rumboAuto && G.pos && G.pos.rumbo != null){ M.seguir = true; mapaPos(); } else if(!M.rumboAuto) girarMapa(0); mapaRumboUI(); mapaFab(); },
  mapaMinimizar:() => { try{ Android.minimizar(); }catch(e){ toast('No se pudo achicar la app', true); } },
  mapaYo:() => { M.seguir = true; mapaSeguirPos(); if(G.pos) M.map.setView([G.pos.lat, G.pos.lng], Math.max(M.map.getZoom(), 16)); else toast('Buscando tu ubicación…'); mapaFab(); },
  mapaLimpiar:() => { if(!M.nav) mapaLimpiar(); },
  verViaje:(id) => { const x = S.viajes.find(v => v.id === id); if(x) mapaAbrir({recorrido:x}); },
  verAuto:() => { if(S.estacionado) mapaAbrir({lugar:lugarAuto(S.estacionado), modo:'foot'}); },
  volverAuto:() => { if(S.estacionado) mapaAbrir({lugar:lugarAuto(S.estacionado), modo:'foot', ir:'foot'}); },
  fijarMec:(id) => {
    const m = S.mecanicos.find(x => x.id === id); if(!m) return;
    confirmar('Guardar ubicación del taller', `¿Estás en <b>${esc(m.nombre)}</b>? Se va a guardar tu ubicación actual como la del taller.`, 'Usar mi ubicación', () => {
      ubicacionActual(p => { m.lat = +p.lat.toFixed(6); m.lng = +p.lng.toFixed(6); save(); render(); toast('Ubicación del taller guardada'); });
    });
  },
  menu:() => { document.getElementById('side').classList.toggle('open'); document.getElementById('scrim').classList.toggle('open'); },
  cerrar:() => cerrarModal(),
};
function cerrarMenu(){ document.getElementById('side').classList.remove('open'); document.getElementById('scrim').classList.remove('open'); }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if(!b) return;
  const f = A[b.dataset.a]; if(f){ e.preventDefault(); f(b.dataset.id, b.dataset.col); }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ if(modalEl.classList.contains('open')) cerrarModal(); else cerrarMenu(); }
  if((e.key === 'Enter' || e.key === ' ') && e.target.matches('.li.click')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('input', e => { const f = e.target.dataset && e.target.dataset.f; if(f && e.target.tagName === 'INPUT'){ UI[f] = e.target.value; render(); } });
document.addEventListener('change', e => {
  const t = e.target;
  if(t.id === 'selV'){ S.vid = t.value; save(); render(); return; }
  if(t.id === 'fileImp' && t.files[0]){
    const r = new FileReader();
    r.onload = () => {
      let d; try{ d = JSON.parse(r.result); }catch(err){ return toast('El archivo no es un backup válido.', true); }
      if(!d || typeof d !== 'object' || !Array.isArray(d.vehiculos)) return toast('El archivo no es un backup de AutoControl.', true);
      confirmar('Importar backup', `Se van a reemplazar los datos actuales por los del backup (${d.vehiculos.length} ${plural(d.vehiculos.length, 'vehículo', 'vehículos')}).`, 'Importar', () => {
        const adj = d._adjuntos; delete d._adjuntos;
        const b = blank(); Object.assign(b, d); COLS.forEach(c => { if(!Array.isArray(b[c])) b[c] = []; });
        b.papeles.forEach(p => { if(TIPO_VIEJO[p.tipo]) p.tipo = TIPO_VIEJO[p.tipo]; });
        S = b; huellas = null; restaurarAdjuntos(adj); toast('Backup importado');
      });
    };
    r.readAsText(t.files[0]); t.value = ''; return;
  }
  const f = t.dataset && t.dataset.f; if(f && t.tagName === 'SELECT'){ UI[f] = t.value; render(); }
});

/* ================== Render ================== */
let toastT;
function toast(msg, err){ const t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : ''); clearTimeout(toastT); toastT = setTimeout(() => t.className = 'toast', 2800); }
function applyTheme(){ const r = document.documentElement; if(S.tema === 'claro') r.dataset.theme = 'light'; else if(S.tema === 'oscuro') r.dataset.theme = 'dark'; else delete r.dataset.theme; }
function renderSide(){
  const v = V(), venc = v ? vencimientos().filter(x => x.estado === 'vencido') : [];
  const cnt = {papeles:venc.filter(x => x.sec === 'papeles').length, patentes:venc.filter(x => x.sec === 'patentes').length, service:venc.filter(x => x.sec === 'service').length};
  document.getElementById('side').innerHTML = `<div class="brand"><span class="brand-logo">${ic('car', 22)}</span><div><b>AutoControl</b><small>El auto, en orden</small></div></div>
    ${v ? `<div class="side-veh">${plate(v.patente, 1)}<div><div class="name">${esc(vNombre(v))}</div><div class="km">${fKm(kmActual(v))}</div></div>
      ${S.vehiculos.length > 1 ? `<select id="selV" aria-label="Vehículo activo">${S.vehiculos.map(x => `<option value="${esc(x.id)}" ${x.id === v.id ? 'selected' : ''}>${esc(vNombre(x))}${x.patente ? ' · ' + esc(fmtPatente(x.patente)) : ''}</option>`).join('')}</select>` : ''}</div>
      ${gpsOn() ? `<button class="gps-side on" data-a="ir" data-id="gps"><span class="pulse"></span> GPS activo · <span id="gpsSideTxt">${nf1.format(S.gpsActivo.dist / 1000)} km</span></button>`
        : S.gpsActivo ? `<button class="gps-side pend" data-a="ir" data-id="gps">${ic('alert', 16)} Recorrido sin terminar</button>`
        : `<button class="gps-side" data-a="gpsIniciar">${ic('nav', 16)} Activar GPS</button>`}` : ''}
    <nav>${SECS.map(s => s.sep ? '<div class="nav-sep"></div>' : `<button class="nav-i ${UI.sec === s.k ? 'on' : ''}" data-a="ir" data-id="${s.k}" style="--c:var(--${s.c});--cb:var(--${s.c}-bg)"${UI.sec === s.k ? ' aria-current="page"' : ''}><span class="chip">${ic(s.i, 17)}</span>${s.l}${cnt[s.k] ? `<span class="badge" title="Vencidos">${cnt[s.k]}</span>` : ''}</button>`).join('')}</nav>
    <div class="side-foot">${S.ultimoBackup ? 'Último backup: ' + fF(S.ultimoBackup) : 'Acordate de exportar un backup'}</div>`;
}
function render(){
  applyTheme(); renderSide(); CH = []; untip();
  const s = SEC(UI.sec) || SEC('resumen'), ae = document.activeElement;
  const fid = ae && ae.id && ae.closest('#main') ? ae.id : null, pos = fid ? ae.selectionStart : null;
  document.getElementById('main').innerHTML = `<div class="sec" style="--c:var(--${s.c});--cb:var(--${s.c}-bg)">${R[s.k]()}</div>`;
  document.querySelectorAll('.li.click').forEach(el => { el.tabIndex = 0; el.setAttribute('role', 'button'); });
  if(fid){ const el = document.getElementById(fid); if(el){ el.focus(); try{ el.setSelectionRange(pos, pos); }catch(e){} } }
  const gt = document.getElementById('gpsTop'); gt.classList.toggle('on', gpsOn()); gt.title = gpsOn() ? 'GPS activo' : 'Activar GPS';
  drawCharts(); miniMapas(); miniaturas(); gpsLive();
}
// Mapitas de vista previa dentro de las tarjetas (tocarlos abre el mapa grande).
const MINI = {};
function miniMapas(){
  for(const k in MINI){ MINI[k].map.remove(); delete MINI[k]; }
  if(!window.L) return;
  document.querySelectorAll('[data-mini]').forEach(el => {
    const map = L.map(el, {zoomControl:false, attributionControl:false, dragging:false, touchZoom:false, scrollWheelZoom:false, doubleClickZoom:false, boxZoom:false, keyboard:false});
    capasBase().calles.addTo(map);
    const [lat, lng] = el.dataset.mini.split(',').map(Number); MINI[el.id] = {map};
    if(el.dataset.mini && !isNaN(lat)){ map.setView([lat, lng], 16); if(el.dataset.ico) L.marker([lat, lng], {icon:pinIcon(el.dataset.ico, 'sel'), interactive:false}).addTo(map); }
    else map.setView([-34.6037, -58.3816], 4);
  });
}
render();
</script>
